<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Admin · Mal und Geteilt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAFCFF; --grid:#DCE7F6; --line:#C9D6EA;
  --ink:#1B3A8C; --ink-soft:#E3EAFA; --on-ink:#FFFFFF;
  --text:#1E2533; --muted:#556072;
  --ok:#1F8A55; --ok-soft:#DDF3E6; --bad:#D33A2C; --bad-soft:#FBDDD8;
  --warn:#B7791F; --off:#8A93A5; --grid-major:#C3D4EE;
  --m-rot:#D93A3F; --m-orange:#E07A12; --m-gelb:#B98A00; --m-gruen:#1E9460; --m-blau:#2F6FE0; --m-lila:#7C4DDB; --m-pink:#D23C85;
  --m-dunkelrot:#8B1A1F; --m-gold:#A87B00; --m-dunkelgruen:#14532D; --m-tuerkis:#0E8C8C; --m-dunkelblau:#1B2F80; --m-braun:#8A5A2B; --m-grau:#6B7280;
  --sans:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#131A29; --grid:#1E2940; --line:#2C3A58;
    --ink:#A9C1FF; --ink-soft:#243150; --on-ink:#0F1626;
    --text:#E8EDF6; --muted:#A1ACC1;
    --ok:#56CC92; --ok-soft:#163627; --bad:#FF7466; --bad-soft:#47201C;
    --warn:#E5B454; --off:#6C768A; --grid-major:#27365A;
    --m-rot:#FF6B6F; --m-orange:#FFA34D; --m-gelb:#FFD34D; --m-gruen:#5BD69A; --m-blau:#7DAAFF; --m-lila:#B79CFF; --m-pink:#FF7EB8; --m-dunkelrot:#D6454C; --m-gold:#F5C84C; --m-dunkelgruen:#3FAF6E; --m-tuerkis:#4FD6D6; --m-dunkelblau:#6C86F0; --m-braun:#C99464; --m-grau:#A1ACC1; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#131A29; --grid:#1E2940; --line:#2C3A58;
  --ink:#A9C1FF; --ink-soft:#243150; --on-ink:#0F1626;
  --text:#E8EDF6; --muted:#A1ACC1;
  --ok:#56CC92; --ok-soft:#163627; --bad:#FF7466; --bad-soft:#47201C;
  --warn:#E5B454; --off:#6C768A; --grid-major:#27365A;
    --m-rot:#FF6B6F; --m-orange:#FFA34D; --m-gelb:#FFD34D; --m-gruen:#5BD69A; --m-blau:#7DAAFF; --m-lila:#B79CFF; --m-pink:#FF7EB8; --m-dunkelrot:#D6454C; --m-gold:#F5C84C; --m-dunkelgruen:#3FAF6E; --m-tuerkis:#4FD6D6; --m-dunkelblau:#6C86F0; --m-braun:#C99464; --m-grau:#A1ACC1; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{background:var(--paper)}
body{margin:0;min-height:100vh;background-color:var(--paper);
  background-image:linear-gradient(var(--grid-major) 1px,transparent 1px),linear-gradient(90deg,var(--grid-major) 1px,transparent 1px),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:120px 120px,120px 120px,24px 24px,24px 24px;color:var(--text);font-family:var(--sans);font-size:1.05rem;line-height:1.5}
.wrap{max-width:1100px;margin:0 auto;padding:20px 20px 60px}
h1{font-size:clamp(1.8rem,5vw,2.4rem);color:var(--ink);margin:12px 0 6px;line-height:1.15}
h2{font-size:1.25rem;color:var(--ink);margin:28px 0 10px}
p{margin:0 0 10px;max-width:65ch}
.muted{color:var(--muted)}
.btn{font:700 1rem var(--sans);min-height:46px;padding:10px 20px;border-radius:12px;border:2px solid var(--ink);background:var(--ink);color:var(--on-ink);cursor:pointer}
.btn.secondary{background:transparent;color:var(--ink)}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.bar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:12px}
.panel{background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:22px;max-width:520px;margin-top:20px}
.pin{font:700 2rem var(--sans);letter-spacing:.2em;width:100%;max-width:280px;border:0;border-bottom:4px solid var(--ink);background:transparent;color:var(--text);padding:4px 0}
.msg{min-height:1.5em;font-weight:700;margin-top:10px}
.msg.bad{color:var(--bad)} .msg.ok{color:var(--ok)}

.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:20px 0 4px}
.sum{background:var(--paper);border-left:4px solid var(--ink);padding:10px 14px}
.sum b{display:block;font-size:2rem;line-height:1.1;color:var(--ink)}
.sum span{color:var(--muted);font-size:.95rem}
.sum.online{border-color:var(--ok)} .sum.online b{color:var(--ok)}
.sum.wrong{border-color:var(--bad)} .sum.wrong b{color:var(--bad)}

.tablewrap{overflow-x:auto;background:var(--paper);border:2px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;min-width:860px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.9rem;color:var(--muted);font-weight:700;background:var(--ink-soft)}
td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
tr.item{cursor:pointer}
tr.item:hover td{background:var(--ink-soft)}
.status{display:inline-flex;align-items:center;gap:8px;font-weight:700;white-space:nowrap}
.status i{width:12px;height:12px;border-radius:50%;display:inline-block;background:var(--off)}
.status.on i{background:var(--ok);box-shadow:0 0 0 4px var(--ok-soft)}
.status.recent i{background:var(--warn)}
.status.on{color:var(--ok)} .status.recent{color:var(--warn)} .status.off{color:var(--muted)}
.name{font-weight:700}
.wrongnum{color:var(--bad)} .oknum{color:var(--ok)}
.details td{background:var(--ink-soft)}
.attempts{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px}
.att{padding:4px 10px;border-radius:8px;border:2px solid;font-weight:700;font-variant-numeric:tabular-nums}
.att.ok{border-color:var(--ok);color:var(--ok)} .att.bad{border-color:var(--bad);color:var(--bad)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.code{font:700 2.4rem var(--sans);letter-spacing:.25em;color:var(--ink)}
.linkbtn{background:none;border:0;padding:0;color:var(--ink);font:700 1rem var(--sans);text-decoration:underline;cursor:pointer}

a.btn{text-decoration:none;display:inline-flex;align-items:center}
.card{background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:20px;margin-top:22px}
.card h2{margin-top:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 22px}
label.l{display:block;font-weight:700;margin:12px 0 6px}
textarea,.inp,select{font:1rem var(--sans);color:var(--text);background:var(--paper);border:2px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{width:100%;resize:vertical;min-height:84px}
.inp{min-height:44px} select{min-height:44px}
textarea:focus-visible,.inp:focus-visible,select:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.tb{font:700 .95rem var(--sans);min-height:40px;min-width:40px;padding:6px 12px;border-radius:10px;border:2px solid var(--line);background:var(--paper);color:var(--text);cursor:pointer}
.tb:hover{border-color:var(--ink)}
.sw{width:40px;padding:0;border-radius:50%;border:3px solid var(--paper);box-shadow:0 0 0 2px var(--line)}
.sw:hover{box-shadow:0 0 0 2px var(--ink)}
.preview{border:2px dashed var(--line);border-radius:12px;padding:12px 14px;min-height:48px;font-size:1.1rem;overflow-wrap:anywhere}
.small{font-size:.92rem}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-weight:700;font-size:.85rem;border:2px solid currentColor}
.pill.on{color:var(--ok)} .pill.off{color:var(--muted)} .pill.bad{color:var(--bad)}
.active{margin-top:14px;padding:12px 14px;border-left:4px solid var(--ok);background:var(--ok-soft);border-radius:8px}
.m-big{font-size:1.5em;line-height:1.2}
.m-rot{color:var(--m-rot)} .m-orange{color:var(--m-orange)} .m-gelb{color:var(--m-gelb)} .m-gruen{color:var(--m-gruen)}
.m-blau{color:var(--m-blau)} .m-lila{color:var(--m-lila)} .m-pink{color:var(--m-pink)}
.m-dunkelrot{color:var(--m-dunkelrot)} .m-gold{color:var(--m-gold)} .m-dunkelgruen{color:var(--m-dunkelgruen)} .m-tuerkis{color:var(--m-tuerkis)}
.m-dunkelblau{color:var(--m-dunkelblau)} .m-braun{color:var(--m-braun)} .m-grau{color:var(--m-grau)}
.ownertag{color:var(--m-rot);font-weight:700;margin-right:.35em}
.tpl{font:700 .9rem var(--sans);border:2px solid var(--line);background:var(--paper);color:var(--text);border-radius:999px;padding:6px 12px;cursor:pointer;min-height:36px}
.tpl:hover{border-color:var(--ink)}
.hist{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.hist li{display:flex;gap:10px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.hist .ht{flex:1;min-width:0;overflow-wrap:anywhere}
.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:340px;overflow:auto}
.feed li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:6px 10px;border-radius:8px;background:var(--ink-soft)}
.feed .fk{font-weight:700} .feed .ok{color:var(--ok)} .feed .bad{color:var(--bad)}
.lb{width:100%;border-collapse:collapse;min-width:0}
.lb td,.lb th{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
.lb td.r,.lb th.r{text-align:right;font-variant-numeric:tabular-nums}
.medal{font-size:1.2rem}
.note{background:var(--ink-soft);border-left:4px solid var(--m-gold);padding:8px 12px;border-radius:8px;margin:8px 0}
.toggle{display:inline-flex;align-items:center;gap:8px;font-weight:700;cursor:pointer}
.toggle input{width:20px;height:20px}
.search{max-width:280px;width:100%}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn.sm{min-height:40px;padding:6px 14px;font-size:.95rem}
.banned td{opacity:.6}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="muted">Lädt …</p></div>

<script>
(function(){
"use strict";
const API = "/api/admin";
const REFRESH_MS = 10 * 60 * 1000;   // alle 10 Minuten neu laden
const ONLINE_MS  = 11 * 60 * 1000;   // Heartbeat kommt alle 10 Min., 1 Min. Puffer
const RECENT_MS  = 60 * 60 * 1000;
const LEVELS = ["sehrleicht","leicht","mittel","schwer","sehrschwer","extrem"];
const LEVEL_NAMES = {sehrleicht:"Sehr leicht", leicht:"Leicht", mittel:"Mittel", schwer:"Schwer", sehrschwer:"Sehr schwer", extrem:"Extrem schwer"};
const COLORS = [["rot","Rot"],["dunkelrot","Dunkelrot"],["orange","Orange"],["gelb","Gelb"],["gold","Gold"],["gruen","Grün"],["dunkelgruen","Dunkelgrün"],["tuerkis","Türkis"],["blau","Blau"],["dunkelblau","Dunkelblau"],["lila","Lila"],["pink","Pink"],["braun","Braun"],["grau","Grau"]];
const TOPICS = [["mix","Gemischt"],["plus","Plus"],["minus","Minus"],["mul","Mal"],["div","Geteilt"],["frac","Brüche"],["root","Wurzeln"],["pot","Potenzen"],["proz","Prozent"],["regeln","Punkt vor Strich"]];
const TEMPLATES = [
  ["Update", "[rot]**UPDATE IN 5 MIN!**[/rot] Bitte kurz fertig rechnen."],
  ["Lob", "[gruen]**Super gemacht, alle!**[/gruen] Weiter so 💪"],
  ["Neu", "[blau]**Neue Aufgaben sind da!**[/blau] Schaut mal unter „Lernen“."],
  ["Challenge", "[gold]**Challenge:**[/gold] Wer schafft heute 20 Aufgaben ohne Fehler?"],
  ["Wartung", "[dunkelrot]**Gleich kurze Wartung!**[/dunkelrot] Die Seite ist ein paar Minuten weg."],
  ["Pause", "[tuerkis]**Zeit für eine Pause!**[/tuerkis] Trink was und mach gleich weiter."]
];

const app = document.getElementById("app");
const esc = x => String(x ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const getToken = () => { try{ return localStorage.getItem("mg_admin_token") || ""; }catch(e){ return ""; } };
const setToken = t => { try{ t ? localStorage.setItem("mg_admin_token", t) : localStorage.removeItem("mg_admin_token"); }catch(e){} };

function renderMarkup(src){
  let h = esc(src || "");
  h = h.replace(/\*\*([\s\S]+?)\*\*/g, "<strong>$1</strong>");
  h = h.replace(/\[gross\]([\s\S]*?)\[\/gross\]/g, '<span class="m-big">$1</span>');
  for(let i = 0; i < 2; i++){
    h = h.replace(/\[(rot|dunkelrot|orange|gelb|gold|gruen|dunkelgruen|tuerkis|blau|dunkelblau|lila|pink|braun|grau)\]([\s\S]*?)\[\/\1\]/g, '<span class="m-$1">$2</span>');
  }
  return h.replace(/\n/g, "<br>");
}

async function api(action, extra){
  const res = await fetch(API, { method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify(Object.assign({ action, token: getToken() }, extra || {})) });
  let data = {};
  try{ data = await res.json(); }catch(e){}
  if(!res.ok){ const err = new Error(data.error || ("Fehler " + res.status)); err.status = res.status; throw err; }
  return data;
}

let learners = [], config = {};
let openId = null, search = "";
let refreshTimer = null, tickTimer = null, nextRefreshAt = 0, serverNow = 0, devices = 1, lastLoad = Date.now();

/* ---------- Start ---------- */
(async function init(){
  if(!getToken()){ renderLogin(); return; }
  try{ await api("check"); startDashboard(); }
  catch(e){ if(e.status === 401) setToken(""); renderLogin(e.status === 401 ? "" : "Server nicht erreichbar: " + e.message); }
})();

/* ---------- Anmelden ---------- */
function renderLogin(note, mode){
  mode = mode || "pin";
  const isPin = mode === "pin";
  app.innerHTML = `
    <div class="row" style="justify-content:flex-end"><a class="btn secondary sm" href="/">← Zur Lernseite</a></div>
    <h1>${isPin ? "Owner werden" : "Gerät verbinden"}</h1>
    <p>${isPin
      ? "Gib deine Einmal-PIN ein. Sie funktioniert nur ein einziges Mal. Danach merkt sich dieser Browser, dass du der Owner bist."
      : "Öffne das Admin-Panel auf einem Gerät, auf dem du schon angemeldet bist, klick auf „Anderes Gerät verbinden“ und gib den 6-stelligen Code hier ein."}</p>
    <div class="panel">
      <label for="pin" style="font-weight:700;display:block;margin-bottom:8px">${isPin ? "Einmal-PIN" : "Gerätecode"}</label>
      <input id="pin" class="pin" type="${isPin ? "password" : "text"}" autocomplete="off" maxlength="30">
      <p class="msg bad" id="msg" aria-live="polite">${esc(note || "")}</p>
      <div class="row" style="margin-top:12px"><button class="btn" id="go">Bestätigen</button></div>
    </div>
    <p style="margin-top:18px"><button class="linkbtn" id="switch">${isPin ? "Ich habe einen Gerätecode" : "Ich habe eine Einmal-PIN"}</button></p>`;
  const pin = document.getElementById("pin");
  const msg = document.getElementById("msg");
  const btn = document.getElementById("go");
  const submit = async () => {
    const v = pin.value.trim();
    if(!v){ msg.className = "msg bad"; msg.textContent = isPin ? "Gib die PIN ein." : "Gib den Code ein."; return; }
    btn.disabled = true;
    try{
      const r = await api(isPin ? "claim" : "link", isPin ? { pin: v, device: navigator.userAgent } : { code: v, device: navigator.userAgent });
      setToken(r.token);
      msg.className = "msg ok"; msg.textContent = "Geschafft, du bist angemeldet.";
      setTimeout(startDashboard, 500);
    }catch(e){
      msg.className = "msg bad"; msg.textContent = e.message;
      pin.value = ""; pin.focus(); btn.disabled = false;
    }
  };
  pin.addEventListener("keydown", e => { if(e.key === "Enter") submit(); });
  btn.onclick = submit;
  document.getElementById("switch").onclick = () => renderLogin("", isPin ? "code" : "pin");
  pin.focus();
}

/* ---------- Dashboard ---------- */
function stopTimers(){ clearInterval(refreshTimer); clearInterval(tickTimer); }
const refreshMs = () => { try{ return localStorage.getItem("mg_admin_live") === "1" ? 30000 : REFRESH_MS; }catch(e){ return REFRESH_MS; } };
function restartRefresh(){ clearInterval(refreshTimer); refreshTimer = setInterval(load, refreshMs()); nextRefreshAt = Date.now() + refreshMs(); updateCountdown(); }

async function startDashboard(){
  stopTimers();
  app.innerHTML = `
    <div class="bar">
      <div>
        <h1>Admin-Panel</h1>
        <p class="muted" style="margin:0">Mal und Geteilt lernen</p>
      </div>
      <div class="row">
        <label class="toggle"><input type="checkbox" id="livemode"> Live (alle 30 Sek.)</label>
        <span class="muted" id="countdown"></span>
        <button class="btn secondary" id="reload">Jetzt aktualisieren</button>
        <a class="btn" href="/">← Zur Lernseite</a>
      </div>
    </div>
    <div class="summary" id="summary"></div>

    <section class="card" aria-labelledby="bc-h">
      <h2 id="bc-h">📢 Nachricht an alle</h2>
      <p class="muted small">Vor jeder Nachricht steht automatisch <b class="ownertag">OWNER:</b> in Rot. Sie erscheint als schmales Banner oben auf der Seite. Alle können dabei ganz normal weiterlernen und das Banner auch wegklicken. Wer gerade auf der Seite ist, sieht es innerhalb von 30 Sekunden. Text markieren und dann Fett, Groß oder eine Farbe anklicken.</p>
      <div class="toolbar" role="toolbar" aria-label="Formatierung">
        <button class="tb" data-wrap="**|**"><b>Fett</b></button>
        <button class="tb" data-wrap="[gross]|[/gross]">Groß</button>
        ${COLORS.map(([c,n]) => `<button class="tb sw" style="background:var(--m-${c})" data-wrap="[${c}]|[/${c}]" aria-label="${n}" title="${n}"></button>`).join("")}
      </div>
      <div class="toolbar" aria-label="Vorlagen">${TEMPLATES.map(([n],i) => `<button class="tpl" data-tpl="${i}">${n}</button>`).join("")}</div>
      <textarea id="bctext" maxlength="500" placeholder="z. B. UPDATE IN 5 MIN!"></textarea>
      <label class="l">Vorschau</label>
      <div class="preview" id="bcprev"><span class="muted">Hier siehst du, wie die Nachricht aussieht.</span></div>
      <div class="row" style="margin-top:14px">
        <label for="bcdur" style="font-weight:700">Anzeigen für</label>
        <input class="inp" id="bcdur" type="number" min="1" value="5" style="width:90px">
        <select id="bcunit" aria-label="Einheit">
          <option value="1">Sekunden</option>
          <option value="60" selected>Minuten</option>
          <option value="3600">Stunden</option>
        </select>
        <button class="btn" id="bcsend">Senden</button>
      </div>
      <p class="msg" id="bcmsg" aria-live="polite"></p>
      <div id="bcactive"></div>
      <details style="margin-top:14px"><summary style="cursor:pointer;font-weight:700">Verlauf (letzte 10 Nachrichten)</summary><ul class="hist" id="bchist"></ul></details>
    </section>

    <section class="card" aria-labelledby="ctl-h">
      <h2 id="ctl-h">⚙️ Seite steuern</h2>
      <div class="grid2">
        <div>
          <label class="l">Wartungsmodus <span id="mstate"></span></label>
          <p class="muted small" style="margin:0 0 8px">Alle sehen einen Pausen-Bildschirm, nur du nicht.</p>
          <input class="inp" id="mtext" maxlength="300" placeholder="Text, z. B. Wir sind gleich wieder da!" style="width:100%">
          <div class="btnrow"><button class="btn sm" id="mon">Einschalten</button><button class="btn secondary sm" id="moff">Ausschalten</button></div>
        </div>
        <div>
          <label class="l" for="flevel">Schwierigkeit für alle</label>
          <p class="muted small" style="margin:0 0 8px">Legt fest, welche Stufe alle beim Üben bekommen.</p>
          <div class="row">
            <select id="flevel">
              <option value="">Frei wählbar</option>
              ${LEVELS.map(l => `<option value="${l}">${LEVEL_NAMES[l]}</option>`).join("")}
            </select>
            <button class="btn sm" id="fset">Übernehmen</button>
          </div>
        </div>
        <div>
          <label class="l" for="ftopic">Thema für alle</label>
          <p class="muted small" style="margin:0 0 8px">Legt fest, welches Thema alle beim Üben bekommen.</p>
          <div class="row">
            <select id="ftopic">
              <option value="">Frei wählbar</option>
              ${TOPICS.map(([k,n]) => `<option value="${k}">${n}</option>`).join("")}
            </select>
            <button class="btn sm" id="tset">Übernehmen</button>
          </div>
        </div>
        <div>
          <label class="l">Alle Seiten neu laden</label>
          <p class="muted small" style="margin:0 0 8px">Praktisch nach einem Update, damit alle die neue Version bekommen.</p>
          <button class="btn secondary sm" id="reloadall">Bei allen neu laden</button>
        </div>
        <div>
          <label class="l">Daten</label>
          <p class="muted small" style="margin:0 0 8px">Liste als Tabelle speichern oder alles löschen.</p>
          <div class="btnrow" style="margin-top:0">
            <button class="btn secondary sm" id="csv">Als CSV exportieren</button>
            <button class="btn secondary sm" id="resetall">Alle Statistiken auf 0</button>
            <button class="btn danger sm" id="delall">Alle Einträge löschen</button>
          </div>
        </div>
      </div>
      <p class="msg" id="ctlmsg" aria-live="polite"></p>
    </section>

    <div class="grid2" style="gap:0 22px">
      <section class="card" aria-labelledby="lb-h">
        <h2 id="lb-h">🏆 Bestenliste</h2>
        <div id="leader"></div>
      </section>
      <section class="card" aria-labelledby="feed-h">
        <h2 id="feed-h">⚡ Live-Aktivität</h2>
        <p class="muted small" style="margin-top:-4px">Die letzten gerechneten Aufgaben von allen.</p>
        <ul class="feed" id="feed"></ul>
      </section>
    </div>

    <div class="row" style="justify-content:space-between;margin-top:26px">
      <h2 style="margin:0">Lernende</h2>
      <input class="inp search" id="search" type="search" placeholder="Name suchen …" aria-label="Name suchen">
    </div>
    <p class="muted">Klick auf eine Zeile für Details und Befehle.</p>
    <div class="tablewrap" id="table"></div>

    <section class="card" aria-labelledby="acc-h">
      <h2 id="acc-h">🔑 Zugang</h2>
      <p class="muted" id="devinfo"></p>
      <label class="row" style="gap:10px;margin:4px 0 16px;cursor:pointer;font-weight:700">
        <input type="checkbox" id="countself" style="width:22px;height:22px">
        Mich auf diesem Gerät beim Lernen mitzählen (zum Testen)
      </label>
      <div class="row">
        <button class="btn secondary" id="newcode">Anderes Gerät verbinden</button>
        <button class="btn danger" id="logout">Auf diesem Gerät abmelden</button>
      </div>
      <div id="codebox"></div>
    </section>`;

  bindDashboard();
  await load();
  restartRefresh();
  tickTimer = setInterval(() => { updateCountdown(); renderActive(); }, 1000);
}

function flash(id, text, ok){
  const el = document.getElementById(id); if(!el) return;
  el.className = "msg " + (ok ? "ok" : "bad"); el.textContent = text;
  clearTimeout(el._t); el._t = setTimeout(() => { el.textContent = ""; }, 4000);
}

function bindDashboard(){
  document.getElementById("reload").onclick = () => load();

  // Formatierung
  const ta = document.getElementById("bctext");
  const prev = document.getElementById("bcprev");
  const updPrev = () => { prev.innerHTML = ta.value.trim() ? `<strong class="ownertag">OWNER:</strong>` + renderMarkup(ta.value) : `<span class="muted">Hier siehst du, wie die Nachricht aussieht.</span>`; };
  document.querySelectorAll("[data-tpl]").forEach(b => b.onclick = () => { ta.value = TEMPLATES[+b.dataset.tpl][1]; updPrev(); ta.focus(); });
  const live = document.getElementById("livemode");
  try{ live.checked = localStorage.getItem("mg_admin_live") === "1"; }catch(e){}
  live.onchange = () => { try{ live.checked ? localStorage.setItem("mg_admin_live","1") : localStorage.removeItem("mg_admin_live"); }catch(e){} restartRefresh(); };
  ta.addEventListener("input", updPrev);
  document.querySelectorAll("[data-wrap]").forEach(b => b.onclick = () => {
    const [open, close] = b.dataset.wrap.split("|");
    const s = ta.selectionStart, e = ta.selectionEnd;
    const sel = ta.value.slice(s, e) || "Text";
    ta.value = ta.value.slice(0, s) + open + sel + close + ta.value.slice(e);
    ta.focus();
    ta.setSelectionRange(s + open.length, s + open.length + sel.length);
    updPrev();
  });

  document.getElementById("bcsend").onclick = async () => {
    const text = ta.value.trim();
    if(!text){ flash("bcmsg", "Schreib zuerst eine Nachricht.", false); ta.focus(); return; }
    const n = Math.max(1, Number(document.getElementById("bcdur").value) || 1);
    const seconds = n * Number(document.getElementById("bcunit").value);
    try{
      const r = await api("broadcast", { text, seconds, style: "banner" });
      config.broadcast = r.broadcast; serverNow = Date.now();
      flash("bcmsg", "Gesendet! Alle sehen sie gleich.", true);
      ta.value = ""; updPrev(); renderActive(true);
    }catch(e){ if(!handleErr(e)) flash("bcmsg", e.message, false); }
  };

  // Steuerung
  const ctl = async (action, extra, okText) => {
    try{ await api(action, extra); flash("ctlmsg", okText, true); await load(); }
    catch(e){ if(!handleErr(e)) flash("ctlmsg", e.message, false); }
  };
  document.getElementById("mon").onclick = () => ctl("maintenance", { on:true, text: document.getElementById("mtext").value }, "Wartungsmodus ist an.");
  document.getElementById("moff").onclick = () => ctl("maintenance", { on:false, text: document.getElementById("mtext").value }, "Wartungsmodus ist aus.");
  document.getElementById("fset").onclick = () => {
    const level = document.getElementById("flevel").value;
    ctl("forceLevel", { level }, level ? `Alle üben jetzt auf „${LEVEL_NAMES[level]}“.` : "Alle können die Schwierigkeit wieder selbst wählen.");
  };
  document.getElementById("tset").onclick = () => {
    const topic = document.getElementById("ftopic").value;
    const n = (TOPICS.find(t => t[0] === topic) || [,""])[1];
    ctl("forceTopic", { topic }, topic ? `Alle üben jetzt „${n}“.` : "Alle können das Thema wieder selbst wählen.");
  };
  document.getElementById("resetall").onclick = () => {
    if(confirm("Richtig, Fehler und Verlauf von ALLEN Lernenden auf 0 setzen? Die Namen bleiben erhalten."))
      ctl("resetAll", {}, "Alle Statistiken wurden auf 0 gesetzt.");
  };
  document.getElementById("reloadall").onclick = () => {
    if(confirm("Bei allen, die gerade auf der Seite sind, wird sie in den nächsten 30 Sekunden neu geladen. Weiter?"))
      ctl("reloadAll", {}, "Alle Seiten werden neu geladen.");
  };
  document.getElementById("csv").onclick = exportCsv;
  document.getElementById("delall").onclick = () => {
    const t = prompt("Das löscht ALLE Lernenden mit ihren Zahlen. Tippe LÖSCHEN zum Bestätigen:");
    if(t && t.trim().toUpperCase() === "LÖSCHEN") ctl("deleteAll", {}, "Alle Einträge wurden gelöscht.");
  };

  const cs = document.getElementById("countself");
  try{ cs.checked = localStorage.getItem("mg_count_self") === "1"; }catch(e){}
  cs.onchange = () => { try{ cs.checked ? localStorage.setItem("mg_count_self","1") : localStorage.removeItem("mg_count_self"); }catch(e){} };

  document.getElementById("search").addEventListener("input", e => { search = e.target.value.trim().toLowerCase(); renderData(); });

  // Zugang
  document.getElementById("newcode").onclick = async () => {
    const box = document.getElementById("codebox");
    try{
      const r = await api("newcode");
      box.innerHTML = `<div class="panel"><p>Tippe auf dem anderen Gerät 5-mal auf den Titel der Lernseite, wähle <b>„Ich habe einen Gerätecode“</b> und gib diesen Code ein. Er gilt ${r.validMinutes} Minuten und nur einmal.</p><p class="code">${esc(r.code)}</p></div>`;
    }catch(e){ handleErr(e); }
  };
  document.getElementById("logout").onclick = async () => {
    const warn = devices > 1
      ? "Wirklich abmelden? Du kannst dich später mit einem Gerätecode von einem deiner anderen Geräte wieder verbinden."
      : "Achtung: Das ist dein einziges angemeldetes Gerät. Wenn du dich abmeldest, kommst du nur mit einer NEUEN PIN wieder rein (in Netlify ADMIN_PIN ändern). Trotzdem abmelden?";
    if(!confirm(warn)) return;
    try{ await api("logout"); }catch(e){}
    setToken(""); stopTimers(); renderLogin();
  };
}

function handleErr(e){
  if(e.status === 401){ setToken(""); stopTimers(); renderLogin("Dein Zugang ist nicht mehr gültig. Melde dich neu an."); return true; }
  return false;
}

async function load(){
  const btn = document.getElementById("reload");
  if(btn) btn.disabled = true;
  try{
    const r = await api("list");
    learners = r.learners || [];
    config = r.config || {};
    serverNow = r.now || Date.now();
    devices = r.devices || 1;
    nextRefreshAt = Date.now() + refreshMs();
    lastLoad = Date.now();
    const di = document.getElementById("devinfo");
    if(di) di.textContent = `Angemeldete Geräte: ${devices}`;
    renderControls();
    renderActive(true);
    renderData();
  }catch(e){
    if(handleErr(e)) return;
    const t = document.getElementById("table");
    if(t) t.innerHTML = `<div class="empty">Daten konnten nicht geladen werden (${esc(e.message)}).</div>`;
  }
  if(btn) btn.disabled = false;
  updateCountdown();
}

function renderControls(){
  const m = config.maintenance || {};
  const ms = document.getElementById("mstate");
  if(ms) ms.innerHTML = m.on ? `<span class="pill bad">AN</span>` : `<span class="pill off">aus</span>`;
  const mt = document.getElementById("mtext");
  if(mt && document.activeElement !== mt) mt.value = m.text || "";
  const fl = document.getElementById("flevel");
  if(fl && document.activeElement !== fl) fl.value = config.forcedLevel || "";
  const ft = document.getElementById("ftopic");
  if(ft && document.activeElement !== ft) ft.value = config.forcedTopic || "";
  const hist = document.getElementById("bchist");
  if(hist){
    const H = config.history || [];
    hist.innerHTML = H.length ? H.map((h,i) => `<li><div class="ht"><strong class="ownertag">OWNER:</strong>${renderMarkup(h.text)}<div class="muted small">${clock(h.sent)}</div></div><button class="btn secondary sm" data-again="${i}">Nochmal</button></li>`).join("")
      : `<li class="muted">Noch keine Nachrichten gesendet.</li>`;
    hist.querySelectorAll("[data-again]").forEach(b => b.onclick = () => {
      const ta = document.getElementById("bctext"); ta.value = H[+b.dataset.again].text; ta.dispatchEvent(new Event("input")); ta.focus(); ta.scrollIntoView({block:"center"});
    });
  }
}

function fmtLeft(ms){
  const s = Math.max(0, Math.round(ms/1000));
  if(s < 60) return `${s} Sek.`;
  const m = Math.floor(s/60);
  if(m < 60) return `${m} Min. ${s%60} Sek.`;
  const h = Math.floor(m/60);
  return `${h} Std. ${m%60} Min.`;
}

let activeKey = "";
function renderActive(force){
  const box = document.getElementById("bcactive"); if(!box) return;
  const b = config.broadcast;
  const offset = Date.now() - lastLoad;   // Zeit seit dem letzten Laden
  const left = b ? b.until - (serverNow + offset) : 0;
  if(!b || left <= 0){
    if(activeKey !== "none"){ box.innerHTML = ""; activeKey = "none"; }
    return;
  }
  if(force || activeKey !== b.id){
    activeKey = b.id;
    box.innerHTML = `<div class="active">
      <b>Läuft gerade</b> <span class="muted small">(noch <span id="bcleft"></span>)</span>
      <div class="preview" style="margin:8px 0;background:var(--paper)"><strong class="ownertag">OWNER:</strong>${renderMarkup(b.text)}</div>
      <button class="btn danger sm" id="bcstop">Jetzt beenden</button></div>`;
    document.getElementById("bcstop").onclick = async () => {
      try{ await api("clearBroadcast"); config.broadcast = null; renderActive(true); flash("bcmsg", "Nachricht beendet.", true); }
      catch(e){ if(!handleErr(e)) flash("bcmsg", e.message, false); }
    };
  }
  const l = document.getElementById("bcleft"); if(l) l.textContent = fmtLeft(left);
}

function updateCountdown(){
  const el = document.getElementById("countdown");
  if(!el || !nextRefreshAt) return;
  const s = Math.max(0, Math.round((nextRefreshAt - Date.now())/1000));
  el.textContent = `Nächste Aktualisierung in ${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
}

function statusOf(l){
  const diff = serverNow - (l.lastSeen || 0);
  if(l.online && diff < ONLINE_MS) return {cls:"on", text:"Online", rank:0};
  if(diff < RECENT_MS) return {cls:"recent", text:"Kürzlich aktiv", rank:1};
  return {cls:"off", text:"Offline", rank:2};
}

function ago(t){
  if(!t) return "–";
  const d = Math.max(0, serverNow + (Date.now() - lastLoad) - t);
  const m = Math.floor(d/60000);
  if(m < 1) return "gerade eben";
  if(m < 60) return `vor ${m} Min.`;
  const h = Math.floor(m/60);
  if(h < 24) return `vor ${h} Std.`;
  const days = Math.floor(h/24);
  if(days < 7) return `vor ${days} ${days === 1 ? "Tag" : "Tagen"}`;
  return new Date(t).toLocaleDateString("de-DE");
}
const clock = t => new Date(t).toLocaleString("de-DE", {day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit"});

function exportCsv(){
  const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const rows = [["Name","Status","Gerade bei","Lernteil","Schwierigkeit","Richtig","Fehler","Quote","Zuletzt aktiv","Dabei seit","Gesperrt"]];
  for(const l of learners){
    const c = l.correct||0, w = l.wrong||0;
    rows.push([l.name, statusOf(l).text, l.detail, l.learnStage, l.level, c, w, c+w ? Math.round(c/(c+w)*100)+" %" : "",
      l.lastSeen ? clock(l.lastSeen) : "", l.firstSeen ? clock(l.firstSeen) : "", l.banned ? "ja" : "nein"]);
  }
  const csv = "\ufeff" + rows.map(r => r.map(q).join(";")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], {type:"text/csv;charset=utf-8"}));
  a.download = `lernende-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

function renderLeader(all){
  const el = document.getElementById("leader"); if(!el) return;
  const top = all.filter(l => (l.correct||0) > 0).sort((a,b) => (b.correct||0) - (a.correct||0)).slice(0, 10);
  if(!top.length){ el.innerHTML = `<p class="muted">Noch hat niemand eine Aufgabe gelöst.</p>`; return; }
  const medal = i => ["🥇","🥈","🥉"][i] || `${i+1}.`;
  el.innerHTML = `<table class="lb"><thead><tr><th>Platz</th><th>Name</th><th class="r">Richtig</th><th class="r">Quote</th></tr></thead><tbody>${
    top.map((l,i) => { const c = l.correct||0, w = l.wrong||0; return `<tr><td class="medal">${medal(i)}</td><td><b>${esc(l.name)}</b></td><td class="r">${c}</td><td class="r">${c+w ? Math.round(c/(c+w)*100) + " %" : "–"}</td></tr>`; }).join("")
  }</tbody></table>`;
}
function renderFeed(all){
  const el = document.getElementById("feed"); if(!el) return;
  const items = [];
  for(const l of all) for(const a of (l.last || [])) items.push({name:l.name, ...a});
  items.sort((a,b) => (b.at||0) - (a.at||0));
  el.innerHTML = items.length ? items.slice(0, 25).map(a =>
    `<li><span class="${a.ok ? "ok" : "bad"} fk">${a.ok ? "✓" : "✗"}</span><span><b>${esc(a.name)}</b>: ${esc(a.t)} = ${esc(a.a)}</span><span class="muted small">${ago(a.at)}</span></li>`).join("")
    : `<li class="muted">Noch keine Aktivität.</li>`;
}

function renderData(){
  const all = learners.map(l => ({...l, st: statusOf(l)}))
    .sort((a,b) => a.st.rank - b.st.rank || (b.lastSeen||0) - (a.lastSeen||0));

  const online = all.filter(r => r.st.rank === 0).length;
  const sumOk = all.reduce((s,r) => s + (r.correct||0), 0);
  const sumBad = all.reduce((s,r) => s + (r.wrong||0), 0);
  const quote = sumOk + sumBad ? Math.round(sumOk/(sumOk+sumBad)*100) + " %" : "–";
  document.getElementById("summary").innerHTML = `
    <div class="sum online"><b>${online}</b><span>gerade online</span></div>
    <div class="sum"><b>${all.length}</b><span>Lernende insgesamt</span></div>
    <div class="sum"><b>${sumOk}</b><span>Aufgaben richtig</span></div>
    <div class="sum wrong"><b>${sumBad}</b><span>Fehler insgesamt</span></div>
    <div class="sum"><b>${quote}</b><span>Trefferquote</span></div>`;

  renderLeader(all); renderFeed(all);
  const rows = search ? all.filter(r => String(r.name).toLowerCase().includes(search)) : all;
  const table = document.getElementById("table");
  if(!all.length){
    table.innerHTML = `<div class="empty">Noch niemand da. Sobald jemand die Lernseite öffnet und seinen Namen eingibt, taucht er hier auf.</div>`;
    return;
  }
  if(!rows.length){
    table.innerHTML = `<div class="empty">Niemand mit „${esc(search)}“ gefunden.</div>`;
    return;
  }

  let html = `<table><thead><tr>
    <th>Status</th><th>Name</th><th>Gerade bei</th><th>Lernteil</th>
    <th style="text-align:right">Richtig</th><th style="text-align:right">Fehler</th><th style="text-align:right">Quote</th><th>Zuletzt aktiv</th>
  </tr></thead><tbody>`;
  for(const r of rows){
    const c = r.correct||0, w = r.wrong||0;
    const q = c + w ? Math.round(c/(c+w)*100) + " %" : "–";
    const where = r.st.rank === 2 ? `<span class="muted">zuletzt: ${esc(r.detail)}</span>` : esc(r.detail);
    html += `<tr class="item${r.banned ? " banned" : ""}" data-id="${esc(r.id)}" tabindex="0" aria-expanded="${openId === r.id}">
      <td><span class="status ${r.st.cls}"><i></i>${r.st.text}</span></td>
      <td class="name">${esc(r.name)}${r.banned ? ` <span class="pill bad">gesperrt</span>` : ""}</td>
      <td>${where}</td>
      <td>${esc(r.learnStage || "–")}</td>
      <td class="num oknum">${c}</td>
      <td class="num wrongnum">${w}</td>
      <td class="num">${q}</td>
      <td>${ago(r.lastSeen)}</td>
    </tr>`;
    if(openId === r.id){
      const last = (r.last || []).slice().reverse();
      html += `<tr class="details"><td colspan="8">
        <b>Letzte Versuche</b> <span class="muted">(neueste zuerst)</span>
        <div class="attempts">${last.length ? last.map(a =>
          `<span class="att ${a.ok ? "ok" : "bad"}" title="${esc(clock(a.at))}">${esc(a.t)} = ${esc(a.a)} ${a.ok ? "✓" : "✗"}</span>`).join("") : `<span class="muted">Noch keine Aufgaben gerechnet.</span>`}</div>
        <p class="muted">Schwierigkeit: ${esc(r.level || "–")}. Ohne Fehler hintereinander: ${r.streak||0}. Dabei seit: ${r.firstSeen ? clock(r.firstSeen) : "–"}.</p>
        ${r.note ? `<div class="note">📝 ${esc(r.note)}</div>` : ""}
        <div class="btnrow">
          <button class="btn sm" data-act="msg">Nachricht senden</button>
          <button class="btn secondary sm" data-act="reset">Statistik zurücksetzen</button>
          <button class="btn secondary sm" data-act="setname">Namen ändern</button>
          <button class="btn secondary sm" data-act="rename">Neuen Namen eingeben lassen</button>
          <button class="btn secondary sm" data-act="note">${r.note ? "Notiz bearbeiten" : "Notiz"}</button>
          <button class="btn secondary sm" data-act="reload">Seite neu laden</button>
          <button class="btn ${r.banned ? "secondary" : "danger"} sm" data-act="ban">${r.banned ? "Entsperren" : "Sperren"}</button>
          <button class="btn danger sm" data-act="delete">Eintrag löschen</button>
        </div>
        <p class="muted small" style="margin-top:8px">Befehle kommen an, sobald die Person die Seite offen hat (innerhalb von 30 Sekunden).</p>
      </td></tr>`;
    }
  }
  html += `</tbody></table>`;
  table.innerHTML = html;

  table.querySelectorAll("tr.item").forEach(tr => {
    const toggle = () => { openId = openId === tr.dataset.id ? null : tr.dataset.id; renderData(); };
    tr.onclick = toggle;
    tr.onkeydown = e => { if(e.key === "Enter" || e.key === " "){ e.preventDefault(); toggle(); } };
  });
  table.querySelectorAll("[data-act]").forEach(b => b.onclick = async e => {
    e.stopPropagation();
    const r = learners.find(l => l.id === openId); if(!r) return;
    const name = r.name, act = b.dataset.act;
    try{
      if(act === "msg"){
        const text = prompt(`Nachricht an ${name} (erscheint bei der Person als kleines Fenster):\n(Formatierung geht auch hier: **fett**, [rot]rot[/rot], [gross]groß[/gross])`);
        if(!text || !text.trim()) return;
        await api("cmd", { id: r.id, type: "msg", text });
        alert("Nachricht verschickt.");
      } else if(act === "reset"){
        if(!confirm(`Richtig, Fehler und Verlauf von „${name}“ auf 0 setzen?`)) return;
        await api("cmd", { id: r.id, type: "reset" });
      } else if(act === "setname"){
        const n = prompt(`Neuer Name für „${name}“:`, name);
        if(!n || !n.trim() || n.trim() === name) return;
        await api("cmd", { id: r.id, type: "setname", text: n.trim().slice(0,30) });
      } else if(act === "note"){
        const n = prompt(`Private Notiz zu „${name}“ (sieht nur du):`, r.note || "");
        if(n === null) return;
        await api("note", { id: r.id, text: n });
      } else if(act === "rename"){
        if(!confirm(`„${name}“ muss beim nächsten Mal einen neuen Namen eingeben. Weiter?`)) return;
        await api("cmd", { id: r.id, type: "rename" });
      } else if(act === "reload"){
        await api("cmd", { id: r.id, type: "reload" });
      } else if(act === "ban"){
        if(!r.banned && !confirm(`„${name}“ sperren? Die Person sieht dann nur noch „Zugang gesperrt“.`)) return;
        await api("ban", { id: r.id, banned: !r.banned });
      } else if(act === "delete"){
        if(!confirm(`Eintrag von „${name}“ wirklich löschen?`)) return;
        await api("delete", { id: r.id }); openId = null;
      }
      await load();
    }catch(err){ if(!handleErr(err)) alert(err.message); }
  });
}
})();
</script>
</body>
</html>
