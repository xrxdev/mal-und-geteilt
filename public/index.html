<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rechnen lernen – Schritt für Schritt</title>
<meta name="description" content="Plus, Minus, Mal, Geteilt, Brüche und Wurzeln Schritt für Schritt lernen und üben.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<script>try{if(localStorage.getItem("mg_admin_token")&&localStorage.getItem("mg_owner_theme")!=="off")document.documentElement.classList.add("owner")}catch(e){}</script>
<style>
:root{
  --paper:#FAFCFF; --paper-2:#F1F5FC; --grid:#DCE7F6; --grid-major:#C3D4EE; --rand:#E9A3A3;
  --ink:#1B3A8C; --ink-soft:#E3EAFA; --on-ink:#FFFFFF;
  --text:#1E2533; --muted:#556072; --line:#C9D6EA;
  --ok:#1F8A55; --ok-soft:#DDF3E6; --bad:#D33A2C; --bad-soft:#FBDDD8;
  --marker:#FFE36E; --glow:rgba(120,160,255,.14); --hole:#E4EAF4; --hole-edge:#C9D3E3; --doodle:#1B3A8C;
  --m-rot:#D93A3F; --m-orange:#E07A12; --m-gelb:#B98A00; --m-gruen:#1E9460; --m-blau:#2F6FE0; --m-lila:#7C4DDB; --m-pink:#D23C85;
  --m-dunkelrot:#8B1A1F; --m-gold:#A87B00; --m-dunkelgruen:#14532D; --m-tuerkis:#0E8C8C; --m-dunkelblau:#1B2F80; --m-braun:#8A5A2B; --m-grau:#6B7280;
  --shadow:0 1px 2px rgba(20,40,90,.06),0 8px 24px rgba(20,40,90,.08);
  --sans:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --hand:"Patrick Hand","Segoe Print","Comic Sans MS","Chalkboard SE",cursive;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#131A29; --paper-2:#182135; --grid:#1E2940; --grid-major:#27365A; --rand:#7C3D47;
    --ink:#A9C1FF; --ink-soft:#243150; --on-ink:#0F1626;
    --text:#E8EDF6; --muted:#A1ACC1; --line:#2C3A58;
    --ok:#56CC92; --ok-soft:#163627; --bad:#FF7466; --bad-soft:#47201C;
    --marker:#6E5A12; --glow:rgba(110,150,255,.12); --hole:#0C111C; --hole-edge:#27324A; --doodle:#A9C1FF;
    --m-rot:#FF6B6F; --m-orange:#FFA34D; --m-gelb:#FFD34D; --m-gruen:#5BD69A; --m-blau:#7DAAFF; --m-lila:#B79CFF; --m-pink:#FF7EB8; --m-dunkelrot:#D6454C; --m-gold:#F5C84C; --m-dunkelgruen:#3FAF6E; --m-tuerkis:#4FD6D6; --m-dunkelblau:#6C86F0; --m-braun:#C99464; --m-grau:#A1ACC1;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#131A29; --paper-2:#182135; --grid:#1E2940; --grid-major:#27365A; --rand:#7C3D47;
  --ink:#A9C1FF; --ink-soft:#243150; --on-ink:#0F1626;
  --text:#E8EDF6; --muted:#A1ACC1; --line:#2C3A58;
  --ok:#56CC92; --ok-soft:#163627; --bad:#FF7466; --bad-soft:#47201C;
  --marker:#6E5A12; --glow:rgba(110,150,255,.12); --hole:#0C111C; --hole-edge:#27324A; --doodle:#A9C1FF;
  --m-rot:#FF6B6F; --m-orange:#FFA34D; --m-gelb:#FFD34D; --m-gruen:#5BD69A; --m-blau:#7DAAFF; --m-lila:#B79CFF; --m-pink:#FF7EB8; --m-dunkelrot:#D6454C; --m-gold:#F5C84C; --m-dunkelgruen:#3FAF6E; --m-tuerkis:#4FD6D6; --m-dunkelblau:#6C86F0; --m-braun:#C99464; --m-grau:#A1ACC1;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px);background:var(--paper)}
body{
  margin:0;min-height:100vh;
  background-color:var(--paper);
  background-image:
    radial-gradient(ellipse 80% 50% at 50% 0%, var(--glow), transparent 70%),
    linear-gradient(var(--grid-major) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid-major) 1px,transparent 1px),
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:100% 900px,120px 120px,120px 120px,24px 24px,24px 24px;
  background-repeat:no-repeat,repeat,repeat,repeat,repeat;
  color:var(--text);
  font-family:var(--sans);font-size:1.125rem;line-height:1.55;
}

/* ---------- Kopfleiste ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--paper);
  background:color-mix(in srgb,var(--paper) 86%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--grid-major)}
.top{max-width:780px;margin:0 auto;padding:10px 20px 10px 44px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:inline-flex;align-items:center;gap:10px;font:700 1.15rem var(--sans);color:var(--ink);background:none;border:0;padding:4px 0;cursor:pointer;-webkit-user-select:none;user-select:none}
.logo{width:36px;height:36px;border-radius:10px;background:var(--ink);display:grid;place-items:center;box-shadow:var(--shadow)}
.logo svg{width:24px;height:24px;stroke:var(--on-ink);stroke-width:2.6;stroke-linecap:round;fill:none}
.top nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.navbtn{font:700 1rem var(--sans);color:var(--ink);background:none;border:2px solid transparent;border-radius:999px;padding:6px 16px;cursor:pointer;min-height:44px;text-decoration:none;display:inline-flex;align-items:center}
.navbtn:hover{background:var(--ink-soft)}
.navbtn[aria-current="page"]{border-color:var(--ink)}
.navbtn[hidden]{display:none}

/* ---------- Seite ---------- */
.sheet{max-width:780px;margin:0 auto;padding:0 20px 90px 44px;position:relative;z-index:1;min-height:calc(100vh - 80px)}
.sheet::before{content:"";position:absolute;left:24px;top:0;bottom:0;width:2px;background:var(--rand);box-shadow:5px 0 0 var(--rand)}
.sheet::after{content:"";position:absolute;left:2px;top:0;bottom:0;width:16px;pointer-events:none;
  background:radial-gradient(circle at 8px 8px,var(--hole) 0 6px,var(--hole-edge) 6px 7px,transparent 7.5px) 0 70px/16px 220px repeat-y}
.deco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;font-family:var(--hand);color:var(--doodle)}
.deco span{position:absolute;opacity:.13;white-space:nowrap;line-height:1}
.deco svg{position:absolute;opacity:.12;stroke:var(--doodle);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:1150px){.deco{display:none}}

h1{font-size:clamp(2rem,6vw,2.9rem);line-height:1.1;color:var(--ink);margin:28px 0 12px;letter-spacing:-.015em}
h2{font-size:1.45rem;line-height:1.25;color:var(--ink);margin:36px 0 10px}
h3{font-size:1.15rem;margin:0 0 6px}
p{margin:0 0 12px;max-width:62ch}
.lead{font-size:1.25rem}
.muted{color:var(--muted)}
.small{font-size:.95rem}
.hand{font-family:var(--hand);font-size:1.55rem;line-height:1.35;color:var(--ink);margin:2px 0;white-space:pre-wrap}
mark{background:linear-gradient(transparent 52%,var(--marker) 52%);color:inherit;padding:0 .12em}
.result{font-size:2rem;font-weight:700;margin:4px 0}

.actions{display:flex;flex-wrap:wrap;gap:12px;margin:24px 0 8px}
.btn{font:700 1.08rem var(--sans);min-height:50px;padding:12px 22px;border-radius:12px;border:2px solid var(--ink);background:var(--ink);color:var(--on-ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{filter:brightness(1.08)}
.btn.secondary{background:transparent;color:var(--ink)}
.btn.secondary:hover{background:var(--ink-soft);filter:none}
.btn.sm{min-height:42px;padding:8px 16px;font-size:1rem}
.btn:disabled{opacity:.35;cursor:not-allowed;filter:none}
.linkbtn{background:none;border:0;padding:0;color:var(--ink);font:700 1rem var(--sans);text-decoration:underline;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

/* ---------- Startseite ---------- */
.hero{padding:10px 0 4px}
.hero h1{font-size:clamp(2.2rem,7vw,3.4rem)}
.hero h1 span{color:var(--m-blau)}
.statstrip{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:22px 0 4px}
.stat{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:12px 16px}
.stat b{display:block;font-size:1.9rem;line-height:1.1;color:var(--ink);font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:.95rem}
.stat.ok b{color:var(--ok)} .stat.bad b{color:var(--bad)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:12px}
.tcard{--c:var(--m-blau);background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.tcard::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--c)}
.ticon{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font:700 1.6rem var(--sans);white-space:nowrap;color:#fff;background:var(--c);flex:none}
.tcard h3{font-size:1.3rem;margin:4px 0 0;color:var(--text)}
.tcard p{margin:0;color:var(--muted);font-size:1rem}
.tprog{height:8px;background:var(--ink-soft);border-radius:4px;overflow:hidden}
.tprog i{display:block;height:100%;background:var(--c);border-radius:4px}
.tmeta{font-size:.92rem;color:var(--muted);font-weight:700}
.tmeta.done{color:var(--ok)}
.tbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto}
.tbtns .btn{flex:1 1 auto;min-height:42px;padding:8px 12px;font-size:1rem}
.t-plus{--c:var(--m-gruen)} .t-minus{--c:var(--m-orange)} .t-mul{--c:var(--m-blau)}
.t-div{--c:var(--m-lila)} .t-frac{--c:var(--m-pink)} .t-root{--c:var(--m-rot)}

/* ---------- Lernen ---------- */
.thead{display:flex;align-items:center;gap:14px;margin-top:14px}
.thead h1{margin:0}
.crumb{margin:22px 0 0;font-size:1rem}
.viz{overflow-x:auto;padding:8px 0 12px}
.dots{display:inline-grid;grid-template-columns:repeat(var(--cols),16px);gap:7px}
.dot{width:16px;height:16px;border-radius:50%;background:var(--ink);display:block}
.dot.b{background:var(--m-gruen)}
.dot.gone{background:transparent;border:2px dashed var(--ink);opacity:.55}
.groups{display:flex;flex-wrap:wrap;gap:12px}
.group{display:inline-grid;grid-template-columns:repeat(var(--cols),16px);gap:6px;padding:10px;border:2px dashed var(--ink);border-radius:14px;align-content:start}
.caption{font-family:var(--hand);font-size:1.3rem;color:var(--muted);margin-top:6px}
.fbars{display:flex;flex-direction:column;gap:10px}
.fbarrow{display:flex;align-items:center;gap:14px}
.fbar{display:flex;border:2px solid var(--ink);border-radius:8px;overflow:hidden;width:min(320px,62vw);height:30px}
.fbar i{flex:1;border-right:2px solid var(--ink)}
.fbar i:last-child{border-right:0}
.fbar i.on{background:var(--m-pink)}
.fbarrow .hand{font-size:1.4rem;min-width:2.4em}
.tricks{list-style:none;padding:0;margin:0}
.tricks li{padding:10px 0;border-bottom:1px solid var(--grid)}
.tricks li:last-child{border-bottom:0}
.tricks b{display:block}
.progress{margin:24px 0 8px}
.progress span{font-weight:700;color:var(--muted)}
.bar{height:10px;background:var(--ink-soft);border-radius:5px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:5px}
.steps{list-style:none;padding:0;margin:16px 0 0;counter-reset:s}
.steps>li{counter-increment:s;position:relative;padding:0 0 22px 48px}
.steps>li::before{content:counter(s);position:absolute;left:0;top:-2px;width:34px;height:34px;border-radius:50%;border:2px solid var(--ink);color:var(--ink);font-weight:700;display:grid;place-items:center;background:var(--paper)}
table.col{border-collapse:collapse;font-family:var(--hand);font-size:1.7rem;color:var(--ink);margin:4px 0}
table.col td{min-width:1.3em;height:1.5em;text-align:center;padding:0 .05em}
table.col tr.mk td{font-size:.95rem;color:var(--m-rot);height:1em;vertical-align:bottom}
table.col tr.res td{border-top:3px solid var(--ink)}
table.col tr.res td:first-child{border-top:0}
.sqtable{display:flex;flex-wrap:wrap;gap:6px 18px;font-family:var(--hand);font-size:1.35rem;color:var(--ink)}

/* Brüche und Wurzeln */
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 .12em;font-size:.9em}
.frac>span:first-child{border-bottom:.08em solid currentColor;padding:0 .18em}
.frac>span:last-child{padding:0 .18em}
.root{display:inline-flex;align-items:flex-start;white-space:nowrap}
.root .rs{position:relative}
.root .rs sup{position:absolute;left:-.1em;top:.05em;font-size:.42em}
.root .rad{border-top:.07em solid currentColor;padding:0 .12em;margin-top:.12em}
.pow sup{font-size:.55em;vertical-align:super;line-height:0;margin-left:.04em}
.pgrid{display:inline-grid;grid-template-columns:repeat(10,14px);gap:4px;padding:6px;border:2px solid var(--ink);border-radius:8px}
.pgrid i{width:14px;height:14px;border-radius:3px;background:var(--ink-soft)}
.pgrid i.on{background:var(--m-tuerkis)}
.t-pot{--c:var(--m-dunkelblau)} .t-proz{--c:var(--m-tuerkis)} .t-regeln{--c:var(--m-braun)}

/* ---------- Üben ---------- */
.controls{display:flex;flex-direction:column;gap:14px;margin:8px 0 4px}
.ctl-label{display:block;font-weight:700;color:var(--muted);margin-bottom:6px;font-size:1rem}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{font:700 1rem var(--sans);color:var(--ink);background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:8px 16px;min-height:44px;cursor:pointer}
.seg button:hover{background:var(--ink-soft)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.seg button:disabled{opacity:.35;cursor:not-allowed}
.forced{margin-top:8px;font-weight:700;color:var(--muted);font-size:1rem}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 0}
.badge{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:2px solid var(--line);background:var(--paper);font-weight:700;font-size:1rem;font-variant-numeric:tabular-nums}
.badge.ok{color:var(--ok)} .badge.bad{color:var(--bad)} .badge.fire{color:var(--m-orange)}
.task{font-size:clamp(2.3rem,10vw,4.2rem);font-weight:700;line-height:1.15;display:flex;flex-wrap:wrap;align-items:center;gap:.25em;color:var(--text)}
.task.small{font-size:clamp(2rem,8vw,3.2rem);margin:12px 0 4px}
.answer{font:inherit;width:2.6em;max-width:100%;text-align:center;border:0;border-bottom:5px solid var(--ink);background:transparent;color:var(--text);padding:0;border-radius:0}
.answer:disabled{opacity:1;color:var(--text)}
.fracin{display:inline-flex;flex-direction:column;align-items:center;gap:.08em;vertical-align:middle}
.fracin .answer{font-size:.72em;width:2.4em;border:3px solid var(--ink);border-radius:10px;min-height:1.25em}
.fracin .fl{width:100%;height:.08em;background:var(--text);border-radius:2px}
.taskbox{margin:20px 0 0;padding:24px 22px;border-radius:20px;border:2px solid var(--line);background:var(--paper);box-shadow:var(--shadow)}
.taskbox .kind{font-size:.95rem;font-weight:700;color:var(--muted);margin-bottom:6px}
.taskbox.ok{background:var(--ok-soft);border-color:var(--ok)}
.taskbox.wrong{animation:blink .5s ease-in-out 4}
@keyframes blink{0%,100%{background:var(--paper);border-color:var(--line)}50%{background:var(--bad-soft);border-color:var(--bad)}}
@media (prefers-reduced-motion: reduce){.taskbox.wrong{animation:none;background:var(--bad-soft);border-color:var(--bad)}}
.msg{min-height:1.6em;margin:14px 0 0;font-weight:700}
.msg.ok{color:var(--ok)} .msg.bad{color:var(--bad)}
.helpbox{margin-top:12px}
.name-input,.pin{font:700 1.6rem var(--sans);width:100%;max-width:360px;border:0;border-bottom:4px solid var(--ink);background:transparent;color:var(--text);padding:4px 0}
.pin{font-size:2rem;letter-spacing:.2em;max-width:300px}

/* ---------- Nachrichten vom Admin ---------- */
.m-big{font-size:1.5em;line-height:1.2}
.m-rot{color:var(--m-rot)} .m-orange{color:var(--m-orange)} .m-gelb{color:var(--m-gelb)} .m-gruen{color:var(--m-gruen)}
.m-blau{color:var(--m-blau)} .m-lila{color:var(--m-lila)} .m-pink{color:var(--m-pink)}
.m-dunkelrot{color:var(--m-dunkelrot)} .m-gold{color:var(--m-gold)} .m-dunkelgruen{color:var(--m-dunkelgruen)} .m-tuerkis{color:var(--m-tuerkis)}
.m-dunkelblau{color:var(--m-dunkelblau)} .m-braun{color:var(--m-braun)} .m-grau{color:var(--m-grau)}
.ownertag{color:var(--m-rot);font-weight:700;letter-spacing:.02em;margin-right:.35em}
.bc{border-bottom:1px solid var(--grid-major);background:var(--paper-2)}
.bc[hidden]{display:none}
.bc-inner{max-width:780px;margin:0 auto;padding:10px 20px 10px 44px;display:flex;gap:12px;align-items:center}
.bc-icon{font-size:1.3rem;line-height:1}
.bc-text{flex:1;font-size:1.1rem;line-height:1.4;overflow-wrap:anywhere;max-height:6.5em;overflow:auto}
.bc-x{background:none;border:2px solid var(--line);color:var(--ink);border-radius:10px;min-width:38px;min-height:38px;font:700 1.1rem var(--sans);cursor:pointer}
.bc-in{animation:bcin .35s ease-out}
@keyframes bcin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.bc-in{animation:none}}
.modal-bg{position:fixed;inset:0;z-index:50;background:rgba(10,15,30,.55);display:grid;place-items:center;padding:20px}
.modal{background:var(--paper);color:var(--text);border:3px solid var(--ink);border-radius:18px;max-width:520px;width:100%;padding:24px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.modal h2{margin:0 0 10px}
.modal .m-body{font-size:1.2rem;line-height:1.5;overflow-wrap:anywhere}
.overlay{position:fixed;inset:0;z-index:60;background:var(--paper);display:grid;place-items:center;padding:24px;text-align:center}
.overlay .o-box{max-width:520px}
.overlay .o-icon{font-size:3.5rem;line-height:1}
.ownernote{background:var(--m-orange);color:#111;font-weight:700;text-align:center;padding:6px 12px;font-size:.95rem}
.ownernote[hidden]{display:none}


/* ================= OWNER-MODUS: nur für den Owner sichtbar ================= */
.aurora,#stars,.ownerbadge{display:none}
html.owner{
  --paper:#0A0714; --paper-2:#140E24; --grid:rgba(160,120,255,.07); --grid-major:rgba(245,200,76,.11); --rand:#F5C84C;
  --ink:#F5C84C; --ink-soft:rgba(245,200,76,.14); --on-ink:#1A1204;
  --text:#F4F1FF; --muted:#B9B0D6; --line:rgba(245,200,76,.26);
  --ok:#5BE3A0; --ok-soft:rgba(91,227,160,.13); --bad:#FF6B7A; --bad-soft:rgba(255,107,122,.15);
  --marker:rgba(245,200,76,.38); --glow:rgba(170,90,255,.22); --hole:#05030A; --hole-edge:rgba(245,200,76,.45); --doodle:#F5C84C;
  --m-rot:#FF6B6F; --m-orange:#FFA34D; --m-gelb:#FFD34D; --m-gruen:#5BD69A; --m-blau:#7DAAFF; --m-lila:#C4A6FF; --m-pink:#FF7EB8;
  --m-dunkelrot:#E0525A; --m-gold:#F5C84C; --m-dunkelgruen:#3FAF6E; --m-tuerkis:#4FD6D6; --m-dunkelblau:#8BA0FF; --m-braun:#D9A574; --m-grau:#B9B0D6;
  --shadow:0 0 0 1px rgba(245,200,76,.06),0 12px 40px rgba(0,0,0,.55);
  color-scheme:dark;
}
html.owner body{background-color:var(--paper)}

<script>
(function(){
  "use strict";
  const app = document.getElementById("app");

  /* ================= Speicher ================= */
  const store = {
    get(k, d){ try{ const v = localStorage.getItem("mg_"+k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
    set(k, v){ try{ localStorage.setItem("mg_"+k, JSON.stringify(v)); }catch(e){} }
  };

  /* ================= Tracking-Zustand (liest der Tracker unten) ================= */
  const S = window.MG_STATE = {
    name: store.get("name", ""), view: "home", detail: "Startseite", level: "",
    correct: 0, wrong: 0, streak: 0, learnStage: "", last: store.get("last", [])
  };
  function track(patch, attempt){
    Object.assign(S, patch || {});
    if(attempt){ S.last.push(attempt); S.last = S.last.slice(-15); store.set("last", S.last); }
    window.dispatchEvent(new Event("mg-track"));
  }
  const esc = x => String(x ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  /* ================= Stufen ================= */
  const LEVELS = ["sehrleicht","leicht","mittel","schwer","sehrschwer","extrem"];
  const LEVEL_NAMES = {sehrleicht:"Sehr leicht", leicht:"Leicht", mittel:"Mittel", schwer:"Schwer", sehrschwer:"Sehr schwer", extrem:"Extrem schwer"};
  const G = { forcedLevel: null, forcedTopic: null };

  function renderMarkup(src){
    let h = esc(src || "");
    h = h.replace(/\*\*([\s\S]+?)\*\*/g, "<strong>$1</strong>");
    h = h.replace(/\[gross\]([\s\S]*?)\[\/gross\]/g, '<span class="m-big">$1</span>');
    for(let i = 0; i < 2; i++){
      h = h.replace(/\[(rot|dunkelrot|orange|gelb|gold|gruen|dunkelgruen|tuerkis|blau|dunkelblau|lila|pink|braun|grau)\]([\s\S]*?)\[\/\1\]/g, '<span class="m-$1">$2</span>');
    }
    return h.replace(/\n/g, "<br>");
  }

  /* ================= Hilfsfunktionen ================= */
  const rnd = (a,b) => a + Math.floor(Math.random()*(b-a+1));
  const pick = arr => arr[Math.floor(Math.random()*arr.length)];
  const L = (...lines) => lines.map(l => `<p class="hand">${l}</p>`).join("");
  const gcd = (a,b) => { a = Math.abs(a); b = Math.abs(b); while(b){ [a,b] = [b, a % b]; } return a; };
  const lcm = (a,b) => a / gcd(a,b) * b;
  const PLACES = ["Einer","Zehner","Hunderter","Tausender","Zehntausender","Hunderttausender","Millionen"];
  const fmt = n => n >= 10000 ? n.toLocaleString("de-DE") : String(n);

  function stepsHTML(Sx){ return `<ol class="steps">${Sx.map(s => `<li><h3>${s.t}</h3>${s.h}</li>`).join("")}</ol>`; }
  function dotGrid(rows, cols){
    return `<div class="viz"><div class="dots" style="--cols:${cols}" aria-hidden="true">${'<i class="dot"></i>'.repeat(rows*cols)}</div></div>`;
  }
  function groups(n, per){
    const g = `<div class="group" style="--cols:${Math.max(1,Math.min(per,4))}">${'<i class="dot"></i>'.repeat(per)}</div>`;
    return `<div class="viz"><div class="groups" aria-hidden="true">${g.repeat(n)}</div></div>`;
  }
  // Zehnerfeld: "plus": a blaue + b grüne Punkte; "minus": a Punkte, die letzten b gestrichelt
  function tenFrame(a, b, mode){
    const total = mode === "plus" ? a + b : a;
    let h = "";
    for(let i = 0; i < total; i++){
      if(mode === "plus") h += i < a ? '<i class="dot"></i>' : '<i class="dot b"></i>';
      else h += i >= a - b ? '<i class="dot gone"></i>' : '<i class="dot"></i>';
    }
    return `<div class="viz"><div class="dots" style="--cols:10" aria-hidden="true">${h}</div></div>`;
  }
  function fracHTML(f){ return f[1] === 1 ? String(f[0]) : `<span class="frac"><span>${f[0]}</span><span>${f[1]}</span></span>`; }
  const fracStr = f => f[1] === 1 ? String(f[0]) : `${f[0]}/${f[1]}`;
  function fracBar(f){
    let cells = ""; for(let i = 0; i < f[1]; i++) cells += `<i class="${i < f[0] ? "on" : ""}"></i>`;
    return `<div class="fbarrow"><span class="hand">${fracHTML(f)}</span><div class="fbar" aria-hidden="true">${cells}</div></div>`;
  }
  function rootHTML(n, kind){
    return `<span class="root"><span class="rs">${kind === 3 ? "<sup>3</sup>" : ""}√</span><span class="rad">${n}</span></span>`;
  }
  // schriftliche Rechnung als Tabelle
  function colTable(top, bottom, result, op, marks){
    const w = Math.max(top.length, bottom.length, result.length);
    const cells = s => s.padStart(w, " ").split("").map(ch => `<td>${ch === " " ? "" : ch}</td>`).join("");
    const mk = []; for(let i = w - 1; i >= 0; i--) mk.push(`<td>${marks[i] || ""}</td>`);
    return `<div class="viz"><table class="col" aria-label="Schriftliche Rechnung">
      <tr class="mk"><td></td>${mk.join("")}</tr>
      <tr><td></td>${cells(top)}</tr>
      <tr><td>${op}</td>${cells(bottom)}</tr>
      <tr class="res"><td></td>${cells(result)}</tr></table></div>`;
  }
  const digit = (n, i) => Math.floor(n / Math.pow(10, i)) % 10;

  /* ================= PLUS ================= */
  function plusSteps(t){
    const {a, b} = t, r = a + b, Sx = [];
    Sx.push({t:"Was bedeutet die Aufgabe?", h:`<p><b>${fmt(a)} + ${fmt(b)}</b> heißt: Zu ${fmt(a)} kommen noch ${fmt(b)} dazu. Wie viele sind es zusammen?</p>`});
    if(r <= 20) Sx.push({t:"So sieht das aus", h:`<p>${a} blaue Punkte und ${b} grüne Punkte:</p>${tenFrame(a,b,"plus")}<p class="caption">Zusammen sind es ${r} Punkte.</p>`});
    let h;
    if(r <= 10){
      const row = []; for(let i = 1; i <= b; i++) row.push(a + i);
      h = `<p>Fang bei ${a} an und zähle ${b} weiter:</p>` + L(`${a} → ${row.join(", ")}`, `Du landest bei ${r}.`);
    } else if(a < 10 && b < 10){
      const x = Math.max(a,b), y = Math.min(a,b), fill = 10 - x, rest = y - fill;
      h = (x !== a ? `<p>Tausch die Zahlen, mit der größeren geht es leichter: ${x} + ${y}.</p>` : "") +
        `<p>Rechne erst bis zur 10, dann den Rest dazu. Die ${y} zerlegst du in ${fill} und ${rest}.</p>` +
        L(`${x} + ${fill} = 10`, `10 + ${rest} = ${r}`);
    } else if(r < 100){
      const z = Math.floor(b / 10) * 10, e = b % 10;
      h = `<p>Zerlege die ${b} in ${z} und ${e}. Erst die Zehner dazu, dann die Einer.</p>` +
        (z ? L(`${a} + ${z} = ${a + z}`) : "") + (e ? L(`${a + z} + ${e} = ${r}`) : "");
    } else {
      const la = String(a).length, lb = String(b).length, w = Math.max(la, lb);
      const lines = [], marks = {};
      let carry = 0;
      for(let i = 0; i < w; i++){
        const parts = [];
        if(i < la) parts.push(digit(a,i));
        if(i < lb) parts.push(digit(b,i));
        const s = parts.reduce((x,y) => x + y, 0) + carry;
        let txt = `${PLACES[i]}: ${parts.join(" + ")}${carry ? " + 1 (gemerkt)" : ""} = ${s}`;
        if(s >= 10){ txt += `  → schreibe ${s % 10}, merke 1`; marks[i + 1] = "1"; carry = 1; }
        else { txt += `  → schreibe ${s}`; carry = 0; }
        lines.push(txt);
      }
      if(carry) lines.push(`Die gemerkte 1 kommt ganz vorne hin.`);
      h = `<p>Bei großen Zahlen rechnest du schriftlich: Schreib die Zahlen genau untereinander, Einer unter Einer. Dann rechnest du von rechts nach links. Ist eine Summe 10 oder mehr, schreibst du nur die hintere Ziffer hin und merkst dir die 1 für die nächste Stelle (die kleine rote 1).</p>` +
        colTable(String(a), String(b), String(r), "+", marks) + L(...lines);
    }
    Sx.push({t:"Rechenweg", h});
    Sx.push({t:"Probe", h:`<p>Rechne rückwärts mit Minus:</p>` + L(`${fmt(r)} − ${fmt(b)} = ${fmt(a)}  ✓`)});
    Sx.push({t:"Ergebnis", h:`<p class="result">${fmt(a)} + ${fmt(b)} = <mark>${fmt(r)}</mark></p>`});
    return Sx;
  }

  /* ================= MINUS ================= */
  function minusSteps(t){
    const {a, b} = t, r = a - b, Sx = [];
    Sx.push({t:"Was bedeutet die Aufgabe?", h:`<p><b>${fmt(a)} − ${fmt(b)}</b> heißt: Du hast ${fmt(a)} und nimmst ${fmt(b)} weg. Wie viele bleiben übrig?</p>`});
    if(a <= 20) Sx.push({t:"So sieht das aus", h:`<p>${a} Punkte, davon werden ${b} weggenommen (die gestrichelten):</p>${tenFrame(a,b,"minus")}<p class="caption">Übrig bleiben ${r}.</p>`});
    let h;
    if(a <= 10){
      const row = []; for(let i = 1; i <= b; i++) row.push(a - i);
      h = `<p>Fang bei ${a} an und zähle ${b} zurück:</p>` + L(`${a} → ${row.join(", ")}`, `Du landest bei ${r}.`);
    } else if(a <= 20 && b < 10 && a % 10 < b){
      const e = a % 10, rest = b - e;
      h = `<p>Rechne erst runter bis zur 10, dann den Rest. Die ${b} zerlegst du in ${e} und ${rest}.</p>` +
        L(`${a} − ${e} = 10`, `10 − ${rest} = ${r}`);
    } else if(a < 100){
      const z = Math.floor(b / 10) * 10, e = b % 10;
      h = `<p>Zerlege die ${b} in ${z} und ${e}. Erst die Zehner weg, dann die Einer.</p>` +
        (z ? L(`${a} − ${z} = ${a - z}`) : "") + (e ? L(`${a - z} − ${e} = ${r}`) : "");
    } else {
      const w = String(a).length, lb = String(b).length;
      const lines = [], marks = {};
      let borrow = 0;
      for(let i = 0; i < w; i++){
        const orig = digit(a,i), eff = orig - borrow;
        const db = i < lb ? digit(b,i) : 0;
        if(i >= lb && borrow === 0){
          if(i === w - 1 && orig === 0) continue;
          lines.push(`${PLACES[i]}: ${orig} bleibt stehen  → schreibe ${orig}`); continue;
        }
        const pre = borrow ? `${orig} − 1 (verliehen) = ${eff}, ` : "";
        if(eff < db){
          lines.push(`${PLACES[i]}: ${pre}${eff} − ${db} geht nicht → leihe einen ${PLACES[i+1]}: ${eff + 10} − ${db} = ${eff + 10 - db}`);
          marks[i] = "+10"; borrow = 1;
        } else {
          const res = eff - db;
          if(i === w - 1 && res === 0) lines.push(`${PLACES[i]}: ${pre}${eff} − ${db} = 0  → vorne schreibt man keine 0`);
          else lines.push(`${PLACES[i]}: ${pre}${eff} − ${db} = ${res}`);
          borrow = 0;
        }
      }
      h = `<p>Bei großen Zahlen rechnest du schriftlich: Zahlen genau untereinander, dann von rechts nach links. Ist oben die Ziffer zu klein, leihst du dir einen von der nächsten Stelle (die rote +10). Die nächste Stelle wird dafür um 1 kleiner.</p>` +
        colTable(String(a), String(b), String(r), "−", marks) + L(...lines);
    }
    Sx.push({t:"Rechenweg", h});
    Sx.push({t:"Probe", h:`<p>Rechne rückwärts mit Plus:</p>` + L(`${fmt(r)} + ${fmt(b)} = ${fmt(a)}  ✓`)});
    Sx.push({t:"Ergebnis", h:`<p class="result">${fmt(a)} − ${fmt(b)} = <mark>${fmt(r)}</mark></p>`});
    return Sx;
  }

  /* ================= MAL ================= */
  function mulTrick(a, b){
    const r = a*b;
    if(b > a && a >= 2 && a <= 10 && b > 10) return `<p>Du darfst die Zahlen tauschen: ${a} · ${b} ist dasselbe wie ${b} · ${a}.</p>` + mulTrick(b, a);
    if(b < a && b >= 2 && b <= 5 && a <= 10) return `<p>Du darfst die Zahlen tauschen: ${a} · ${b} ist dasselbe wie ${b} · ${a}. Das ist leichter.</p>` + mulTrick(b, a);
    if(a === 1) return `<p>Einmal eine Zahl ist einfach die Zahl selbst.</p>` + L(`1 · ${b} = ${r}`);
    if(b === 1) return `<p>Eine Zahl mal 1 bleibt gleich.</p>` + L(`${a} · 1 = ${r}`);
    if(a === 10) return `<p>Mal 10 ist leicht: Häng einfach eine 0 an die ${b} dran.</p>` + L(`${b}  →  ${r}`);
    if(b === 10) return `<p>Mal 10 ist leicht: Häng einfach eine 0 an die ${a} dran.</p>` + L(`${a}  →  ${r}`);
    if(a === 2) return `<p>Mal 2 heißt verdoppeln.</p>` + L(`${b} + ${b} = ${r}`);
    if(a === 3) return `<p>Erst verdoppeln, dann noch einmal die ${b} dazu.</p>` + L(`2 · ${b} = ${2*b}`, `${2*b} + ${b} = ${r}`);
    if(a === 4) return `<p>Mal 4 heißt: verdoppeln und dann nochmal verdoppeln.</p>` + L(`${b} + ${b} = ${2*b}`, `${2*b} + ${2*b} = ${r}`);
    if(a === 5) return `<p>Mal 5 ist die Hälfte von mal 10.</p>` + L(`10 · ${b} = ${10*b}`, `Die Hälfte von ${10*b} ist ${r}`);
    if(a === 9) return `<p>Trick für mal 9: Rechne erst mal 10 und nimm dann einmal die ${b} weg.</p>` + L(`10 · ${b} = ${10*b}`, `${10*b} − ${b} = ${r}`);
    if(a >= 6 && a <= 8){
      const x = 5*b, y = (a-5)*b;
      return `<p>Zerlege die ${a} in 5 und ${a-5}. Mal 5 ist leicht, den Rest rechnest du dazu.</p>` + L(`5 · ${b} = ${x}`, `${a-5} · ${b} = ${y}`, `${x} + ${y} = ${r}`);
    }
    const t = Math.floor(a/10)*10, o = a % 10, x = t*b, y = o*b;
    if(o === 0) return `<p>Rechne erst ${t/10} · ${b} und häng dann eine 0 dran.</p>` + L(`${t/10} · ${b} = ${(t/10)*b}`, `→  ${r}`);
    return `<p>Zerlege die ${a} in ${t} und ${o}. Rechne beide Teile einzeln und zähle sie dann zusammen.</p>` +
      L(`${t} · ${b} = ${x}   (${t/10} · ${b} = ${(t/10)*b}, dann 0 dran)`, `${o} · ${b} = ${y}`, `${x} + ${y} = ${r}`);
  }
  function mulSteps(t){
    const {a, b} = t, r = a*b, Sx = [];
    let m = `<p><b>${a} · ${b}</b> heißt: Nimm die ${b} genau ${a}-mal.</p>`;
    if(a >= 2 && a <= 10 && b <= 20) m += L(`${Array(a).fill(b).join(" + ")} = ${r}`);
    Sx.push({t:"Was bedeutet die Aufgabe?", h:m});
    if(a > 1 && a <= 12 && b <= 12 && r <= 100) Sx.push({t:"So sieht das aus", h:`<p>${a} Reihen mit je ${b} ${b === 1 ? "Punkt" : "Punkten"}:</p>${dotGrid(a,b)}`});
    Sx.push({t:"Rechenweg", h:mulTrick(a,b)});
    Sx.push({t:"Ergebnis", h:`<p class="result">${a} · ${b} = <mark>${r}</mark></p>`});
    return Sx;
  }

  /* ================= GETEILT ================= */
  function divTrick(a, b){
    const c = a/b;
    if(b === 1) return `<p>Geteilt durch 1 bleibt die Zahl gleich.</p>` + L(`${a} : 1 = ${a}`);
    if(b === 10) return `<p>Geteilt durch 10 ist leicht: Nimm die 0 am Ende weg.</p>` + L(`${a}  →  ${c}`);
    if(b === 2) return `<p>Geteilt durch 2 heißt halbieren. Welche Zahl plus sich selbst ergibt ${a}?</p>` + L(`${c} + ${c} = ${a}`, `Also ist ${a} : 2 = ${c}`);
    if(c <= 10){
      const row = []; for(let i = 1; i <= c; i++) row.push(i*b);
      return `<p>Denk an die Mal-Aufgabe: <b>? · ${b} = ${a}</b>. Zähle in ${b}er-Schritten, bis du bei ${a} bist, und zähl mit, wie viele Schritte es waren.</p>` +
        L(row.join(", "), `Das sind ${c} Schritte, also ist ${a} : ${b} = ${c}`);
    }
    const t = Math.floor(c/10)*10, o = c % 10, X = t*b, Y = o*b;
    if(o === 0) return `<p>Rechne erst ohne die 0: ${a/10} : ${b}. Dann häng die 0 wieder dran.</p>` + L(`${a/10} : ${b} = ${c/10}`, `→  ${c}`);
    return `<p>Zerlege die ${a} in zwei Teile, die sich leicht durch ${b} teilen lassen.</p>` +
      L(`${a} = ${X} + ${Y}`, `${X} : ${b} = ${t}`, `${Y} : ${b} = ${o}`, `${t} + ${o} = ${c}`);
  }
  function divSteps(t){
    const {a, b} = t, c = a/b, Sx = [];
    Sx.push({t:"Was bedeutet die Aufgabe?", h:`<p><b>${a} : ${b}</b> heißt: Verteile ${a} gerecht auf ${b} ${b === 1 ? "Gruppe" : "Gruppen"}. Wie viele bekommt jede Gruppe?</p><p>Oder anders gefragt: Wie oft passt die ${b} in die ${a}?</p>`});
    if(b > 1 && b <= 10 && a <= 64) Sx.push({t:"So sieht das aus", h:`<p>${a} Punkte, gerecht verteilt auf ${b} Gruppen:</p>${groups(b,c)}<p class="caption">Jede Gruppe hat ${c}.</p>`});
    Sx.push({t:"Rechenweg", h:divTrick(a,b)});
    Sx.push({t:"Probe", h:`<p>Mit der Mal-Aufgabe prüfst du, ob es stimmt:</p>` + L(`${c} · ${b} = ${a}  ✓`)});
    Sx.push({t:"Ergebnis", h:`<p class="result">${a} : ${b} = <mark>${c}</mark></p>`});
    return Sx;
  }

  /* ================= BRÜCHE ================= */
  function fracCalc(op, x, y){
    const [a,b] = x, [c,d] = y;
    let n, m;
    if(op === "+"){ n = a*d + c*b; m = b*d; }
    else if(op === "−"){ n = a*d - c*b; m = b*d; }
    else if(op === "·"){ n = a*c; m = b*d; }
    else { n = a*d; m = b*c; }
    const g = gcd(n, m) || 1;
    return [n/g, m/g];
  }
  const reduceF = f => { const g = gcd(f[0], f[1]) || 1; return [f[0]/g, f[1]/g]; };
  function mixedNote(f){
    if(f[1] === 1 || f[0] < f[1]) return "";
    const w = Math.floor(f[0]/f[1]), r = f[0] % f[1];
    return `<p>Der Bruch ist größer als 1. Als gemischte Zahl geschrieben: <b>${w} und ${fracHTML([r, f[1]])}</b>, denn ${f[1]} Teile ergeben ein Ganzes.</p>`;
  }
  function kuerzen(n, m){
    if(n === 0) return { html: L(`Oben steht 0, also ist das Ergebnis 0.`), res:[0,1] };
    const g = gcd(n, m);
    if(g === 1) return { html: `<p>Kürzen geht nicht, denn ${n} und ${m} haben keinen gemeinsamen Teiler außer 1. Fertig!</p>`, res:[n,m] };
    return { html: `<p>Jetzt kürzen: Oben und unten durch dieselbe Zahl teilen. Die größte Zahl, die in ${n} und in ${m} passt, ist ${g}.</p>` +
      L(`${fracHTML([n,m])} = ${fracHTML([n/g, m/g])}   (oben und unten : ${g})`), res:[n/g, m/g] };
  }
  function fracSteps(t){
    const {op, x, y, ans} = t, Sx = [];
    const [a,b] = x, [c,d] = y;
    const opWord = {"+":"plus","−":"minus","·":"mal",":":"geteilt durch"}[op];
    const meaning = {
      "+": "Du zählst zwei Bruchteile zusammen. Das geht nur, wenn beide Brüche den gleichen Nenner (die untere Zahl) haben.",
      "−": "Du nimmst einen Bruchteil von einem anderen weg. Auch das geht nur mit gleichem Nenner.",
      "·": "Du nimmst einen Bruchteil von einem Bruchteil. Das ist am einfachsten: oben mal oben, unten mal unten.",
      ":": "Durch einen Bruch teilen heißt: mit dem umgedrehten Bruch (dem Kehrwert) malnehmen."
    }[op];
    Sx.push({t:"Was bedeutet die Aufgabe?", h:`<p><b>${fracStr(x)} ${opWord} ${fracStr(y)}</b>: ${meaning}</p><p class="muted small">Zur Erinnerung: Oben steht der <b>Zähler</b> (wie viele Teile), unten der <b>Nenner</b> (in wie viele Teile das Ganze geteilt ist).</p>`});
    if((op === "+" || op === "−") && b <= 12 && d <= 12){
      Sx.push({t:"So sieht das aus", h:`<div class="viz"><div class="fbars">${fracBar(x)}${fracBar(y)}</div></div><p class="caption">Jeder Balken ist ein Ganzes, die bunten Felder sind die Teile.</p>`});
    }
    let h = "", n, m;
    if(op === "+" || op === "−"){
      if(b === d){
        n = op === "+" ? a + c : a - c; m = b;
        h += `<p>Die Nenner sind schon gleich (${b}). Du rechnest nur die Zähler, der Nenner bleibt.</p>` +
          L(`${a} ${op} ${c} = ${n}`, `${fracHTML(x)} ${op} ${fracHTML(y)} = ${fracHTML([n, m])}`);
      } else {
        m = lcm(b, d);
        const k1 = m / b, k2 = m / d;
        const mult = q => { const r = []; for(let v = q; v <= m; v += q) r.push(v); return r.join(", "); };
        h += `<p>Die Nenner sind verschieden (${b} und ${d}). Such den kleinsten gemeinsamen Nenner: die kleinste Zahl, die in der ${b}er-Reihe und in der ${d}er-Reihe vorkommt.</p>` +
          L(`${b}er-Reihe: ${mult(b)}`, `${d}er-Reihe: ${mult(d)}`, `Gemeinsamer Nenner: ${m}`) +
          `<p>Jetzt erweitern: Oben und unten mit derselben Zahl malnehmen, damit unten ${m} steht. Der Wert bleibt dabei gleich.</p>` +
          (k1 > 1 ? L(`${fracHTML(x)} = ${fracHTML([a*k1, m])}   (oben und unten · ${k1})`) : L(`${fracHTML(x)} hat schon ${m} unten.`)) +
          (k2 > 1 ? L(`${fracHTML(y)} = ${fracHTML([c*k2, m])}   (oben und unten · ${k2})`) : L(`${fracHTML(y)} hat schon ${m} unten.`));
        n = op === "+" ? a*k1 + c*k2 : a*k1 - c*k2;
        h += `<p>Jetzt sind die Nenner gleich. Du rechnest die Zähler:</p>` +
          L(`${a*k1} ${op} ${c*k2} = ${n}`, `${fracHTML([a*k1, m])} ${op} ${fracHTML([c*k2, m])} = ${fracHTML([n, m])}`);
      }
    } else {
      let yy = y;
      if(op === ":"){
        yy = [d, c];
        h += `<p>Dreh den zweiten Bruch um (Kehrwert) und nimm dann mal:</p>` + L(`${fracHTML(y)}  umgedreht  ${fracHTML(yy)}`, `${fracHTML(x)} : ${fracHTML(y)} = ${fracHTML(x)} · ${fracHTML(yy)}`);
      }
      n = a * yy[0]; m = b * yy[1];
      h += `<p>Zähler mal Zähler, Nenner mal Nenner:</p>` + L(`oben: ${a} · ${yy[0]} = ${n}`, `unten: ${b} · ${yy[1]} = ${m}`, `${fracHTML(x)} · ${fracHTML(yy)} = ${fracHTML([n, m])}`);
    }
    const k = kuerzen(n, m);
    h += k.html;
    if(k.res[1] === 1 && k.res[0] !== 0) h += `<p>Unten steht jetzt 1, also ist das Ergebnis einfach die ganze Zahl ${k.res[0]}.</p>`;
    Sx.push({t:"Rechenweg", h});
    Sx.push({t:"Ergebnis", h:`<p class="result">${fracHTML(x)} ${op} ${fracHTML(y)} = <mark>${fracHTML(ans)}</mark></p>` + mixedNote(ans)});
    return Sx;
  }

  /* ================= WURZELN ================= */
  const SQ_END = {0:[0],1:[1,9],4:[2,8],5:[5],6:[4,6],9:[3,7]};
  const CUBE_END = {0:0,1:1,8:2,7:3,4:4,5:5,6:6,3:7,2:8,9:9};
  function rootSteps(t){
    const {n, ans:r, kind} = t, Sx = [];
    const sym = kind === 3 ? "∛" : "√";
    Sx.push({t:"Was bedeutet die Aufgabe?", h: kind === 2
      ? `<p><b>√${n}</b> fragt: <b>Welche Zahl mal sich selbst ergibt ${n}?</b> Die Wurzel ist also Mal-Rechnen rückwärts.</p>`
      : `<p><b>∛${n}</b> ist die dritte Wurzel. Sie fragt: <b>Welche Zahl dreimal mit sich selbst malgenommen ergibt ${n}?</b></p>`});
    if(kind === 2 && r <= 10 && r >= 2) Sx.push({t:"So sieht das aus", h:`<p>${n} Punkte kann man zu einem Quadrat legen. Jede Seite hat dann ${r} Punkte:</p>${dotGrid(r,r)}<p class="caption">Ein Quadrat mit ${r} · ${r} = ${n} Punkten.</p>`});
    let h;
    if(kind === 2){
      if(r <= 10){
        h = `<p>Das kennst du aus dem Einmaleins. Such die Zahl, die mal sich selbst ${n} ergibt:</p>` + L(`${r} · ${r} = ${n}`);
      } else {
        const lo = Math.floor(r/10)*10, hi = lo + 10;
        if(r === lo){
          h = `<p>${n} endet auf 00. Dann rechnest du erst ohne die Nullen:</p>` + L(`${lo/10} · ${lo/10} = ${(lo/10)*(lo/10)}`, `also ${lo} · ${lo} = ${n}`);
        } else {
          const ld = n % 10, ends = SQ_END[ld];
          h = `<p>Grenze die Zahl erst ein:</p>` + L(`${lo} · ${lo} = ${lo*lo}`, `${hi} · ${hi} = ${hi*hi}`, `${n} liegt dazwischen, also liegt die Wurzel zwischen ${lo} und ${hi}.`) +
            `<p>Jetzt der Trick mit der letzten Ziffer: ${n} endet auf ${ld}. Das passiert nur, wenn die gesuchte Zahl auf ${ends.join(" oder ")} endet. Probier es aus:</p>` +
            L(...ends.map(e => { const c = lo + e; return `${c} · ${c} = ${c*c}  ${c === r ? "✓" : "✗"}`; }));
        }
      }
    } else {
      if(r <= 10){
        const row = []; for(let i = 1; i <= r; i++) row.push(`${i} · ${i} · ${i} = ${i*i*i}`);
        h = `<p>Probiere die Zahlen der Reihe nach, bis du bei ${n} bist:</p>` + L(...row);
      } else {
        const e = CUBE_END[n % 10];
        h = `<p>Grenze ein: 10 · 10 · 10 = 1000 und 20 · 20 · 20 = 8000. ${n} liegt dazwischen, also liegt die Zahl zwischen 10 und 20.</p>` +
          `<p>Bei der dritten Wurzel verrät die letzte Ziffer alles: ${n} endet auf ${n % 10}, also endet die gesuchte Zahl auf ${e}.</p>` +
          L(`${r} · ${r} · ${r} = ${n}  ✓`);
      }
    }
    Sx.push({t:"Rechenweg", h});
    Sx.push({t:"Probe", h: L(kind === 2 ? `${r} · ${r} = ${n}  ✓` : `${r} · ${r} · ${r} = ${n}  ✓`)});
    Sx.push({t:"Ergebnis", h:`<p class="result">${sym}${n} = <mark>${r}</mark></p>`});
    return Sx;
  }

  /* ================= POTENZEN ================= */
  const SUP = n => String(n).split("").map(ch => "⁰¹²³⁴⁵⁶⁷⁸⁹"[+ch]).join("");
  const powHTML = (a, n) => `<span class="pow">${a}<sup>${n}</sup></span>`;
  function potSteps(t){
    const {a, n, ans} = t, Sx = [];
    let m;
    if(n === 0) m = `<p><b>${a} hoch 0</b> ist eine Sonderregel: <b>Jede Zahl hoch 0 ergibt 1</b> (außer 0 selbst).</p>`;
    else if(n === 1) m = `<p><b>${a} hoch 1</b> heißt: Die ${a} kommt genau einmal vor. Es wird also gar nichts malgenommen.</p>`;
    else {
      m = `<p><b>${a} hoch ${n}</b> heißt: Nimm die ${a} genau ${n}-mal und rechne alles mal. Die große Zahl unten heißt <b>Grundzahl</b>, die kleine oben <b>Hochzahl</b>.</p>`;
      if(n <= 8) m += L(`${powHTML(a,n)} = ${Array(n).fill(a).join(" · ")}`);
    }
    Sx.push({t:"Was bedeutet die Aufgabe?", h:m});
    if(n === 2 && a >= 2 && a <= 10) Sx.push({t:"So sieht das aus", h:`<p>Hoch 2 heißt auch „zum Quadrat“, weil ${a} · ${a} Punkte genau ein Quadrat ergeben:</p>${dotGrid(a,a)}`});
    let h;
    if(n === 0) h = L(`${powHTML(a,0)} = 1`);
    else if(n === 1) h = L(`${powHTML(a,1)} = ${a}`);
    else if(a === 1) h = `<p>1 mal 1 bleibt immer 1, egal wie oft.</p>` + L(`${powHTML(1,n)} = 1`);
    else if(a === 10) h = `<p>Bei 10 hoch ${n} schreibst du eine 1 mit ${n} Nullen dahinter.</p>` + L(`1 und ${n} Nullen  →  ${fmt(ans)}`);
    else {
      const lines = []; let v = a;
      for(let i = 2; i <= n; i++){
        const nv = v * a;
        let line = `${fmt(v)} · ${a} = ${fmt(nv)}`;
        if(a > 10 && a % 10 !== 0){
          const z = Math.floor(a/10)*10, e = a % 10;
          line += `   (${fmt(v)} · ${z} = ${fmt(v*z)}, ${fmt(v)} · ${e} = ${fmt(v*e)}, zusammen ${fmt(nv)})`;
        }
        lines.push(line); v = nv;
      }
      h = `<p>Rechne Schritt für Schritt: Du nimmst das Ergebnis immer wieder mal ${a}, bis du ${n} ${a === 2 ? "Zweien" : "Faktoren"} hast.</p>` + L(...lines);
    }
    Sx.push({t:"Rechenweg", h});
    Sx.push({t:"Ergebnis", h:`<p class="result">${powHTML(a,n)} = <mark>${fmt(ans)}</mark></p>`});
    return Sx;
  }

  /* ================= PROZENT ================= */
  function percentGrid(p){
    let c = ""; for(let i = 0; i < 100; i++) c += `<i class="${i < p ? "on" : ""}"></i>`;
    return `<div class="viz"><div class="pgrid" aria-hidden="true">${c}</div></div>`;
  }
  function prozSteps(t){
    const {p, g, ans} = t, Sx = [];
    Sx.push({t:"Was bedeutet die Aufgabe?", h:`<p><b>${p} % von ${fmt(g)}</b>: Prozent heißt „von hundert“. Stell dir vor, ${fmt(g)} wird in 100 gleich große Teile geteilt. Davon nimmst du ${p} Teile.</p>`});
    if(p <= 100) Sx.push({t:"So sieht das aus", h:`<p>Ein Feld mit 100 Kästchen ist das Ganze (100 %). ${p} davon sind eingefärbt:</p>${percentGrid(p)}`});
    let h;
    if(p === 100) h = `<p>100 % ist immer das Ganze.</p>` + L(`100 % von ${fmt(g)} = ${fmt(g)}`);
    else if(p === 50) h = `<p>50 % ist genau die Hälfte.</p>` + L(`${fmt(g)} : 2 = ${fmt(ans)}`);
    else if(p === 25) h = `<p>25 % ist ein Viertel. Du teilst durch 4.</p>` + L(`${fmt(g)} : 4 = ${fmt(ans)}`);
    else if(p === 75) h = `<p>75 % sind drei Viertel: erst ein Viertel ausrechnen, dann mal 3.</p>` + L(`${fmt(g)} : 4 = ${fmt(g/4)}`, `3 · ${fmt(g/4)} = ${fmt(ans)}`);
    else if(p === 10) h = `<p>10 % ist ein Zehntel. Du teilst durch 10 (eine 0 weg).</p>` + L(`${fmt(g)} : 10 = ${fmt(ans)}`);
    else if(p === 1) h = `<p>1 % ist ein Hundertstel. Du teilst durch 100 (zwei Nullen weg).</p>` + L(`${fmt(g)} : 100 = ${fmt(ans)}`);
    else if(g % 10 === 0 && p % 10 === 0 && p < 100){
      const y = g / 10;
      h = `<p>Rechne erst 10 % aus, das ist leicht. Dann nimmst du so oft mal, wie du Zehner-Prozente brauchst.</p>` +
        L(`10 % von ${fmt(g)} = ${fmt(g)} : 10 = ${fmt(y)}`, `${p} % = ${p/10} · ${fmt(y)} = ${fmt(ans)}`);
    } else if(g % 10 === 0 && p % 10 === 5 && p < 100 && (g/10) % 2 === 0){
      const y = g / 10, half = y / 2, k = Math.floor(p/10), K = k * y;
      h = `<p>Rechne erst 10 % aus. 5 % ist dann einfach die Hälfte davon.</p>` +
        L(`10 % = ${fmt(g)} : 10 = ${fmt(y)}`, `5 % = ${fmt(y)} : 2 = ${fmt(half)}`) +
        (k ? L(`${k*10} % = ${k} · ${fmt(y)} = ${fmt(K)}`, `${p} % = ${fmt(K)} + ${fmt(half)} = ${fmt(ans)}`) : L(`${p} % = ${fmt(half)}`));
    } else if(g % 100 === 0){
      const o = g / 100;
      h = `<p>Rechne über 1 %: 1 % ist ein Hundertstel, also ${fmt(g)} : 100. Dann nimmst du das ${p}-mal.</p>` +
        L(`1 % = ${fmt(g)} : 100 = ${fmt(o)}`, `${p} % = ${p} · ${fmt(o)} = ${fmt(ans)}`);
    } else {
      h = `<p>Allgemeiner Weg: erst mal ${p}, dann durch 100.</p>` + L(`${p} · ${fmt(g)} = ${fmt(p*g)}`, `${fmt(p*g)} : 100 = ${fmt(ans)}`);
    }
    if(p > 100) h += `<p>Mehr als 100 % heißt: Das Ergebnis ist größer als ${fmt(g)}.</p>`;
    Sx.push({t:"Rechenweg", h});
    Sx.push({t:"Ergebnis", h:`<p class="result">${p} % von ${fmt(g)} = <mark>${fmt(ans)}</mark></p>`});
    return Sx;
  }

  /* ================= PUNKT VOR STRICH ================= */
  const exprStr = tk => tk.map((x,i) => x === "(" ? "(" : x === ")" ? ")" : (typeof x === "number" ? fmt(x) : ` ${x} `)).join("")
    .replace(/\(\s+/g, "(").replace(/\s+\)/g, ")").replace(/\s{2,}/g, " ").trim();
  function exprSteps(tokens){
    let tk = tokens.slice(); const out = []; let valid = true, guard = 0;
    const calc = (a, op, b) => op === "+" ? a + b : op === "−" ? a - b : op === "·" ? a * b : a / b;
    const collapse = t => { // (n) -> n
      for(let i = 0; i + 2 < t.length; i++) if(t[i] === "(" && typeof t[i+1] === "number" && t[i+2] === ")"){ t.splice(i, 3, t[i+1]); i = -1; }
      return t;
    };
    while(tk.length > 1 && ++guard < 50){
      let s = 0, e = tk.length - 1, inParen = false;
      let open = -1;
      for(let i = 0; i < tk.length; i++){ if(tk[i] === "(") open = i; else if(tk[i] === ")"){ s = open + 1; e = i - 1; inParen = true; break; } }
      const seg = tk.slice(s, e + 1);
      let idx = seg.findIndex(x => x === "·" || x === ":");
      const hasStrich = seg.some(x => x === "+" || x === "−");
      let why;
      if(idx >= 0) why = hasStrich ? "Punkt vor Strich" : "Von links nach rechts";
      else { idx = seg.findIndex(x => x === "+" || x === "−"); why = "Von links nach rechts"; }
      if(idx < 1) { valid = false; break; }
      const a = seg[idx-1], op = seg[idx], b = seg[idx+1];
      const v = calc(a, op, b);
      if(!Number.isInteger(v) || v < 0) valid = false;
      tk.splice(s + idx - 1, 3, v);
      tk = collapse(tk);
      const count = seg.filter(x => typeof x !== "number").length;
      const desc = inParen ? `Klammer zuerst: ${fmt(a)} ${op} ${fmt(b)} = ${fmt(v)}`
        : count === 1 ? `Jetzt der letzte Schritt: ${fmt(a)} ${op} ${fmt(b)} = ${fmt(v)}`
        : `${why}: ${fmt(a)} ${op} ${fmt(b)} = ${fmt(v)}`;

  /* ---------- Sternenhimmel (nur Owner-Ansicht) ---------- */
  const Stars = (() => {
    let cv, ctx, W = 0, H = 0, list = [], shoot = null, raf = 0, running = false, inited = false;
    const reduce = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
    function resize(){
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      W = cv.clientWidth; H = cv.clientHeight;
      cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
      const n = Math.round(W * H / 9000);
      list = Array.from({length:n}, () => ({x:Math.random()*W, y:Math.random()*H, r:Math.random()*1.3+.3, p:Math.random()*Math.PI*2, s:.4+Math.random()*1.2, gold:Math.random() < .18}));
      if(running && reduce()) draw(0);
    }
    function draw(t){
      ctx.clearRect(0,0,W,H);
      const still = reduce();
      for(const st of list){
        ctx.globalAlpha = still ? .7 : .35 + .65 * (0.5 + 0.5*Math.sin(st.p + t/1000*st.s));
        ctx.fillStyle = st.gold ? "#F5C84C" : "#E8E2FF";
        ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, Math.PI*2); ctx.fill();
      }
      if(!still){
        if(!shoot && Math.random() < .004) shoot = {x:Math.random()*W*.8, y:Math.random()*H*.4, vx:6+Math.random()*4, vy:2+Math.random()*2, life:1};
        if(shoot){
          ctx.globalAlpha = shoot.life;
          const g = ctx.createLinearGradient(shoot.x, shoot.y, shoot.x - shoot.vx*14, shoot.y - shoot.vy*14);
          g.addColorStop(0, "rgba(255,233,168,1)"); g.addColorStop(1, "rgba(255,233,168,0)");
          ctx.strokeStyle = g; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(shoot.x, shoot.y); ctx.lineTo(shoot.x - shoot.vx*14, shoot.y - shoot.vy*14); ctx.stroke();
          shoot.x += shoot.vx; shoot.y += shoot.vy; shoot.life -= .012;
          if(shoot.life <= 0 || shoot.x > W + 50 || shoot.y > H + 50) shoot = null;
        }
      }
      ctx.globalAlpha = 1;
      if(running && !still && document.visibilityState === "visible") raf = requestAnimationFrame(draw);
    }
    function start(){
      cv = cv || document.getElementById("stars"); if(!cv) return;
      if(!inited){
        try{ ctx = cv.getContext("2d"); }catch(e){ ctx = null; }

      </div>
      <h2>Themen</h2>
      ${topicGrid()}`;
    bindTopicGrid();
  }

  /* ================= Lernen ================= */
  function startTopic(k){
    curTopic = k;
    const st = lt(k);
    if(st.done && st.stage !== "ex"){ st.stage = "intro"; st.idx = 0; }
    saveLearn();
    go("learn");
  }
  function renderLearn(){
    if(!curTopic){
      track({detail: "Wählt ein Thema"});
      app.innerHTML = `<h1>Was willst du lernen?</h1><p class="lead">Jedes Thema hat eine Erklärung und 10 Beispiele mit Rechenweg. Du kannst in jeder Reihenfolge lernen.</p>${topicGrid()}`;
      bindTopicGrid();
      return;
    }
    const st = lt(curTopic);
    if(st.stage === "intro") renderIntro(); else if(st.stage === "finished") renderTopicDone(); else renderExample();
  }
  function topicHead(k, title){
    return `<p class="crumb"><button class="linkbtn" data-go="learn">← Alle Themen</button></p>
      <div class="thead t-${k}"><div class="ticon" aria-hidden="true">${TOPICS[k].icon}</div><h1>${title}</h1></div>`;
  }
  function renderIntro(){
    const k = curTopic;
    track({detail: `Liest die Erklärung zu ${TOPICS[k].name}`});
    app.innerHTML = `${topicHead(k, TOPICS[k].name)}<div style="margin-top:16px">${INTRO[k]()}</div>
      <p style="margin-top:24px">Als Nächstes schauen wir uns 10 Beispiele an.</p>
      <div class="actions"><button class="btn" id="ok">Verstanden</button></div>`;
    document.getElementById("ok").onclick = () => { const st = lt(k); st.stage = "ex"; st.idx = 0; saveLearn(); render(); window.scrollTo(0,0); };
  }
  function renderExample(){
    const k = curTopic, st = lt(k), T = TOPICS[k];
    const i = Math.min(st.idx, T.examples.length - 1), t = T.examples[i], last = i === T.examples.length - 1;
    track({detail: `${T.name}-Beispiel ${i+1} von 10: ${taskLabel(t)}`});
    app.innerHTML = `${topicHead(k, T.name)}
      <div class="progress"><span>Beispiel ${i+1} von ${T.examples.length}</span><div class="bar"><i style="width:${(i+1)/T.examples.length*100}%"></i></div></div>
      <div class="task small">${taskHTML(t)} = ?</div>
      ${stepsHTML(T.steps(t))}
      <div class="actions">
        <button class="btn secondary" id="back">${i > 0 ? "Zurück" : "Erklärung nochmal"}</button>
        <button class="btn" id="next">${last ? "Abschließen" : "Nächstes Beispiel"}</button>
      </div>`;
    document.getElementById("back").onclick = () => { if(i > 0) st.idx--; else st.stage = "intro"; saveLearn(); render(); window.scrollTo(0,0); };
    document.getElementById("next").onclick = () => {
      if(!last) st.idx++; else { st.done = true; st.stage = "finished"; }
      saveLearn(); render(); window.scrollTo(0,0);
    };
  }
  function renderTopicDone(){
    const k = curTopic, T = TOPICS[k];
    const next = TOPIC_ORDER.find(x => !(learn[x] && learn[x].done));
    track({detail: `Hat ${T.name} abgeschlossen`});
    app.innerHTML = `${topicHead(k, "Geschafft! 🎉")}
      <p class="lead" style="margin-top:14px">Du hast alle Beispiele zu <b>${T.name}</b> durchgearbeitet. Jetzt ist der beste Moment, um selbst zu rechnen.</p>
      <div class="actions">
        <button class="btn" id="pr">Jetzt ${T.name} üben</button>
        ${next ? `<button class="btn secondary" data-learn="${next}">Nächstes Thema: ${TOPICS[next].name}</button>` : ""}
      </div>
      <p><button class="linkbtn" data-go="learn">Alle Themen ansehen</button></p>`;
    document.getElementById("pr").onclick = () => { settings.topic = k; store.set("settings", settings); lt(k).stage = "intro"; saveLearn(); go("practice"); };
    app.querySelectorAll("[data-learn]").forEach(b => b.onclick = () => startTopic(b.dataset.learn));
  }

  /* ================= Üben ================= */
  function makeTask(){
    let t, key, guard = 0;
    do{
      const sel = curPracticeTopic();
      const topic = sel === "mix" ? pick(TOPIC_ORDER) : sel;
      t = TOPICS[topic].gen(curLevel());
      key = taskLabel(t);
    } while(key === lastKey && ++guard < 20);
    lastKey = key;
    return t;
  }
  function newTask(){ P = {task:makeTask(), solved:false, locked:false, tries:0}; renderTask(); }

  function renderPractice(){
    const forced = G.forcedLevel, fTopic = G.forcedTopic;
    const chip = (group, val, label, on, dis) => `<button data-${group}="${val}" aria-pressed="${on}"${dis ? " disabled" : ""}>${label}</button>`;
    app.innerHTML = `
      <h1>Üben</h1>
      <p>Rechne die Aufgabe und tippe dein Ergebnis ein. Wenn es richtig ist, geht es mit „Weiter“ zur nächsten Aufgabe.</p>
      <div class="controls">
        <div>
          <span class="ctl-label" id="typ-l">Thema</span>
          <div class="seg" role="group" aria-labelledby="typ-l">
            ${chip("topic","mix","Gemischt", curPracticeTopic() === "mix", fTopic && fTopic !== "mix")}${TOPIC_ORDER.map(k => chip("topic", k, `${TOPICS[k].icon} ${TOPICS[k].name}`, curPracticeTopic() === k, fTopic && fTopic !== k)).join("")}
          </div>
          ${fTopic ? `<p class="forced">Das Thema ist gerade auf „${fTopic === "mix" ? "Gemischt" : TOPICS[fTopic].name}“ festgelegt.</p>` : ""}
        </div>
        <div>
          <span class="ctl-label" id="lvl-l">Schwierigkeit</span>
          <div class="seg" role="group" aria-labelledby="lvl-l">
            ${LEVELS.map(l => chip("level", l, LEVEL_NAMES[l], curLevel() === l, forced && l !== forced)).join("")}
          </div>
          ${forced ? `<p class="forced">Die Schwierigkeit ist gerade auf „${LEVEL_NAMES[forced]}“ festgelegt.</p>` : ""}
        </div>
      </div>
      <div class="badges" id="badges"></div>
      <div id="taskarea"></div>`;
    app.querySelectorAll("[data-level]").forEach(b => b.onclick = () => { if(G.forcedLevel) return; settings.level = b.dataset.level; store.set("settings", settings); renderPractice(); });
    app.querySelectorAll("[data-topic]").forEach(b => b.onclick = () => { if(G.forcedTopic) return; settings.topic = b.dataset.topic; store.set("settings", settings); renderPractice(); });
    newTask();
  }
  function updateStats(){
    const el = document.getElementById("badges");
    if(el) el.innerHTML = `<span class="badge ok">✓ ${stats.total} richtig</span><span class="badge bad">✗ ${stats.wrong} Fehler</span><span class="badge fire">🔥 Serie ${streak}</span>${stats.best ? `<span class="badge">🏆 Beste Serie ${stats.best}</span>` : ""}`;
  }
  function renderTask(){
    const t = P.task, T = TOPICS[t.topic];
    const area = document.getElementById("taskarea");
    track({detail: `Übt: ${taskLabel(t)}  (${T.name}, ${LEVEL_NAMES[curLevel()]})`, level: LEVEL_NAMES[curLevel()]});
    const isFrac = t.topic === "frac";
    const w = Math.max(2.4, ansText(t).length * 0.62 + 0.8);
    const input = isFrac
      ? `<span class="fracin"><input class="answer" id="ans" inputmode="numeric" autocomplete="off" aria-label="Zähler (oben)"><span class="fl"></span><input class="answer" id="ans2" inputmode="numeric" autocomplete="off" aria-label="Nenner (unten), bei ganzen Zahlen leer lassen"></span>`
      : `<input class="answer" id="ans" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" style="width:${w}em" aria-label="Dein Ergebnis">`;
    area.innerHTML = `
      <div class="taskbox" id="box">
        <div class="kind">${T.icon} ${T.name} · ${LEVEL_NAMES[curLevel()]}</div>
        <div class="task"><span>${taskHTML(t)} =</span>${input}</div>
        ${isFrac ? `<p class="muted small" style="margin-top:10px">Oben Zähler, unten Nenner. Bei einer ganzen Zahl bleibt unten frei.</p>` : ""}
        <p class="msg" id="msg" aria-live="polite"></p>
      </div>
      <div class="actions">
        <button class="btn" id="check">Prüfen</button>
        <button class="btn" id="next" disabled>Weiter</button>
        <button class="btn secondary" id="help" hidden>Rechenweg zeigen</button>
      </div>
      <div class="helpbox" id="helpbox"></div>`;
    area.querySelectorAll(".answer").forEach(inp => {
      inp.addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); check(); } });
      inp.addEventListener("input", () => { inp.value = inp.value.replace(/[^0-9]/g, "").slice(0, 8); });
    });
    document.getElementById("check").onclick = check;
    document.getElementById("next").onclick = () => { if(P.solved) newTask(); };
    document.getElementById("help").onclick = showHelp;
    updateStats();
    document.getElementById("ans").focus({preventScroll:true});
  }
  function showHelp(){
    const t = P.task;
    const box = document.getElementById("helpbox");
    box.innerHTML = `<h2>So rechnest du die Aufgabe</h2>${stepsHTML(TOPICS[t.topic].steps(t))}`;
    document.getElementById("help").hidden = true;
    box.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block:"start"});
  }
  function readAnswer(t){
    const v1 = document.getElementById("ans").value.trim();
    if(t.topic !== "frac"){
      if(v1 === "") return {empty:true};
      return {ok: Number(v1) === t.ans, given: v1};
    }
    const v2 = document.getElementById("ans2").value.trim();
    if(v1 === "") return {empty:true};
    const n = Number(v1), d = v2 === "" ? 1 : Number(v2);
    if(d === 0) return {zero:true};
    const ok = n * t.ans[1] === t.ans[0] * d;
    const given = v2 === "" ? v1 : `${v1}/${v2}`;
    const note = ok && d !== 1 && gcd(n, d) > 1 ? ` Gekürzt wäre es ${fracStr(t.ans)}.` : "";
    return {ok, given, note};
  }
  function check(){
    if(!P || P.solved || P.locked) return;
    const t = P.task;
    const msg = document.getElementById("msg"), box = document.getElementById("box");
    const btnCheck = document.getElementById("check"), btnNext = document.getElementById("next");
    const inputs = [...document.querySelectorAll("#taskarea .answer")];
    const r = readAnswer(t);
    if(r.empty){ msg.className = "msg"; msg.textContent = "Tippe zuerst dein Ergebnis ein."; inputs[0].focus(); return; }
    if(r.zero){ msg.className = "msg bad"; msg.textContent = "Unten darf keine 0 stehen."; inputs[1].focus(); return; }
    const attempt = {t: taskLabel(t).slice(0,30), a: String(r.given).slice(0,12), ok: r.ok, at: Date.now()};
    if(r.ok){
      P.solved = true;
      if(P.tries === 0){ streak++; if(streak > stats.best) stats.best = streak; }
      stats.total++; store.set("stats", stats);
      track({correct: stats.total, streak}, attempt);
      box.classList.add("ok");
      msg.className = "msg ok";
      msg.textContent = (P.tries === 0 ? "Richtig! Super gemacht." : "Richtig! Gut, dass du drangeblieben bist.") + (r.note || "");
      inputs.forEach(i => i.disabled = true);
      btnCheck.disabled = true; btnNext.disabled = false; btnNext.focus();
      updateStats();
    } else {
      P.tries++; streak = 0; P.locked = true;
      stats.wrong++; store.set("stats", stats);
      track({wrong: stats.wrong, streak: 0}, attempt);
      box.classList.remove("wrong"); void box.offsetWidth; box.classList.add("wrong");
      msg.className = "msg bad";
      msg.textContent = `${r.given} ist leider nicht richtig. Rechne die Aufgabe nochmal.`;
      inputs.forEach(i => i.disabled = true);
      btnCheck.disabled = true;
      document.getElementById("help").hidden = !!document.getElementById("helpbox").innerHTML;
      updateStats();
      setTimeout(() => {
        if(!document.body.contains(box)) return;
        box.classList.remove("wrong");
        P.locked = false;
        inputs.forEach(i => { i.disabled = false; i.value = ""; });
        btnCheck.disabled = false;
        inputs[0].focus({preventScroll:true});
      }, 2000);
    }
  }

  /* ================= Live-Verbindung zum Admin ================= */
  const PAGE_LOADED = Date.now();
  const POLL_MS = 30 * 1000;
  const isOwnerHere = () => !!adminToken();

  const modalQueue = [];
  let modalOpen = null;
  function openModal(m){ modalQueue.push(m); if(!modalOpen) nextModal(); }
  function closeModal(){
    if(!modalOpen) return;
    const m = modalOpen; modalOpen = null;
    document.getElementById("modal-bg")?.remove();
    if(m.onClose) m.onClose();
    nextModal();
  }
  function nextModal(){
    const m = modalQueue.shift(); if(!m) return;
    modalOpen = m;
    const bg = document.createElement("div");
    bg.className = "modal-bg"; bg.id = "modal-bg";
    bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-t">
      <h2 id="modal-t">${m.titleHTML || esc(m.title || "Nachricht")}</h2>
      <div class="m-body">${m.html}</div>
      <div class="actions" style="margin-top:20px"><button class="btn" id="modal-ok">OK</button></div></div>`;
    document.body.appendChild(bg);
    const ok = document.getElementById("modal-ok");
    ok.onclick = closeModal; ok.focus();
    bg.addEventListener("keydown", e => { if(e.key === "Escape") closeModal(); });
  }

  // Nachricht an alle: immer als schmales Banner oben, man kann ganz normal weiterlernen
  let bcShown = null, bcTimer = null;
  function hideBanner(){ const el = document.getElementById("bc"); el.hidden = true; el.innerHTML = ""; bcShown = null; }
  function showBroadcast(b, serverNow){
    if(!b){ if(bcShown) hideBanner(); return; }
    if(store.get("bcDismissed","") === b.id){ if(bcShown) hideBanner(); return; }
    if(bcShown === b.id) return;
    bcShown = b.id;
    clearTimeout(bcTimer);
    bcTimer = setTimeout(hideBanner, Math.min(2147000000, Math.max(1000, b.until - serverNow)));
    const el = document.getElementById("bc");
    el.innerHTML = `<div class="bc-inner bc-in"><span class="bc-icon" aria-hidden="true">📢</span><div class="bc-text"><strong class="ownertag">OWNER:</strong>${renderMarkup(b.text)}</div><button class="bc-x" aria-label="Nachricht schließen">×</button></div>`;
    el.hidden = false;
    el.querySelector(".bc-x").onclick = () => { store.set("bcDismissed", b.id); hideBanner(); };
  }

  function setOverlay(o){
    let el = document.getElementById("overlay");
    if(!o){ if(el) el.remove(); return; }
    if(!el){ el = document.createElement("div"); el.id = "overlay"; el.className = "overlay"; document.body.appendChild(el); }
    el.innerHTML = `<div class="o-box"><div class="o-icon" aria-hidden="true">${o.icon}</div><h1>${esc(o.title)}</h1><div class="lead">${o.html}</div></div>`;
  }

  function resetStats(){
    stats.total = 0; stats.wrong = 0; stats.best = 0; store.set("stats", stats);
    streak = 0; S.last = []; store.set("last", []);
    track({correct:0, wrong:0, streak:0});
    if(view === "practice") updateStats();
    if(view === "home") renderHome();
    openModal({ title:"Neustart", html:"Deine Statistik wurde zurückgesetzt. Auf ein Neues!" });
  }
  function runCmd(c){
    const done = store.get("cmdDone", []);
    if(done.includes(c.id)) return;
    done.push(c.id); store.set("cmdDone", done.slice(-40));
    if(c.type === "msg"){
      openModal({ titleHTML:`Nachricht vom <span class="ownertag">OWNER</span>`, html: renderMarkup(c.text) });
    } else if(c.type === "reset"){
      resetStats();
    } else if(c.type === "setname"){
      const n = String(c.text || "").trim().slice(0, 30);
      if(n){ S.name = n; store.set("name", n); track({}); if(view === "home") renderHome(); }
    } else if(c.type === "rename"){
      S.name = ""; store.set("name", "");
      go(view);
    } else if(c.type === "reload"){
      location.reload();
    }
  }

  function applyState(st){
    const owner = isOwnerHere();
    if(st.reloadAt && st.reloadAt > PAGE_LOADED && !owner){ location.reload(); return; }
    if(st.banned && !owner){
      setOverlay({ icon:"🚫", title:"Zugang gesperrt", html:"Du kannst diese Seite gerade nicht benutzen." });
    } else if(st.maintenance && !owner){
      setOverlay({ icon:"🛠️", title:"Kurze Pause", html: st.maintenance.text ? renderMarkup(st.maintenance.text) : "Die Seite wird gerade verbessert. Schau gleich nochmal vorbei!" });
    } else {
      setOverlay(null);
    }
    const note = document.getElementById("ownernote");
    note.hidden = !(owner && st.maintenance);
    note.textContent = owner && st.maintenance ? "Wartungsmodus ist an. Nur du siehst die Seite normal." : "";

    const before = G.forcedLevel + "|" + G.forcedTopic;
    G.forcedLevel = LEVELS.includes(st.forcedLevel) ? st.forcedLevel : null;
    G.forcedTopic = st.forcedTopic === "mix" || TOPICS[st.forcedTopic] ? st.forcedTopic : null;
    if(before !== G.forcedLevel + "|" + G.forcedTopic && view === "practice" && S.name) renderPractice();

    if(st.resetAt){
      const seen = store.get("resetSeen", null);
      if(seen === null) store.set("resetSeen", st.resetAt);
      else if(st.resetAt > seen){ store.set("resetSeen", st.resetAt); if(!owner) resetStats(); }
    }

    showBroadcast(st.broadcast, st.now || Date.now());
    (st.cmds || []).forEach(runCmd);
  }

  async function pollState(){
    let id = ""; try{ id = localStorage.getItem("mg_id") || ""; }catch(e){}
    try{
      const r = await fetch("/api/state?id=" + encodeURIComponent(id), { cache:"no-store" });
      if(!r.ok) return;
      applyState(await r.json());
    }catch(e){}
  }
  setTimeout(pollState, 400);
  setInterval(() => { if(document.visibilityState === "visible") pollState(); }, POLL_MS);
  document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible") pollState(); });

  /* ================= Start ================= */
  window.__mg = { TOPICS, LEVELS, taskLabel };   // nur zum Testen
  go("home");
})();
</script>

<!-- ============ Fortschritt an den Server (Netlify Function) schicken ============ -->
<script>
(function(){
  "use strict";
  const HEARTBEAT_MS = 10 * 60 * 1000; // alle 10 Minuten "Ich bin noch da"
  const ENDPOINT = "/api/track";
  // Owner wird nicht mitgezählt, außer "Mich selbst mitzählen" ist im Admin-Panel an
  const skip = () => { try{ return !!localStorage.getItem("mg_admin_token") && localStorage.getItem("mg_count_self") !== "1"; }catch(e){ return false; } };

  function rand(n){ const a = new Uint8Array(n); crypto.getRandomValues(a); return Array.from(a, b => b.toString(16).padStart(2,"0")).join(""); }
  let id, secret;
  try{
    id = localStorage.getItem("mg_id"); secret = localStorage.getItem("mg_secret");
    if(!id || !secret){ id = rand(12); secret = rand(24); localStorage.setItem("mg_id", id); localStorage.setItem("mg_secret", secret); }
  }catch(e){ id = rand(12); secret = rand(24); }

  function payload(online){
    if(skip()) return null;
    const S = window.MG_STATE;
    if(!S || !S.name) return null;
    return JSON.stringify({ id, secret, data: {
      name: S.name, view: S.view, detail: S.detail, level: S.level, learnStage: S.learnStage,
      correct: S.correct, wrong: S.wrong, streak: S.streak, last: S.last, online: !!online
    }});
  }
  function push(online){
    const body = payload(online); if(!body) return;
    fetch(ENDPOINT, { method: "POST", headers: {"Content-Type": "application/json"}, body, keepalive: true }).catch(() => {});
  }
  function pushOffline(){
    const body = payload(false); if(!body) return;
    if(navigator.sendBeacon) navigator.sendBeacon(ENDPOINT, new Blob([body], {type: "application/json"}));
    else push(false);
  }
  let t = null;
  window.addEventListener("mg-track", () => { clearTimeout(t); t = setTimeout(() => push(true), 800); });
  setInterval(() => { if(document.visibilityState === "visible") push(true); }, HEARTBEAT_MS);
  document.addEventListener("visibilitychange", () => { document.visibilityState === "visible" ? push(true) : pushOffline(); });
  window.addEventListener("pagehide", pushOffline);
  push(true);
})();
</script>
